# 经验（跨会话保留）：
#   - 实体名是常用词的（虚空、提瓦特、记忆、灵魂），probe 的候选噪声极大，
#     必须叠加限定词（虚空终端 / 提瓦特七国 / 地脉记忆）定向补，否则可用率低于三成。
#   - 组织类实体（愚人众、教令院）大量出现于「X 的学者/士兵」式修饰，要只收组织本身。
#   - **角色/神明类实体（钟离、纳西妲）优先取 `char.obc.<自己>` 的角色页**，
#     用名字 probe 会混入大量对话提及；角色页里的「角色故事」才是设定来源。
#   - 收到 8-15 条即可停止；只有素材特别丰富的（神之眼 29、深渊 18、地脉 17）才到 15+。
#   - `_batch.py` 的设定类白名单已含 event；但 event 类实体（海灯节这类节庆）设定往往
#     散在活动剧情而非独立条目，容易收不到东西。

