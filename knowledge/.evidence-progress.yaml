# 证据补全进度 · 跨会话持久化
#
# 用途：批量补证据是长任务，单次会话做不完。上下文不足时，
#       以本文件为准恢复：标准在 standard、做过在 done、顺序在 order。
#
# 复跑一次完整流程：
#   tools/python/python.exe scripts/audit_entity_gaps.py --type concept,organization,event,deity,nation --min-mentions 20 --write
#   tools/python/python.exe scripts/probe_topic.py --entity <ID> --limit 4 --json > tmp.json
#   （筛选，写 seed.yaml 或 knowledge/evidence-overrides.yaml）
#   tools/python/python.exe scripts/load_knowledge.py            # 干跑，必须 0 错误
#   tools/python/python.exe scripts/load_knowledge.py --apply
#   tools/python/python.exe scripts/export_entity_cards.py --apply

standard:
  density: "15-30 条；素材质量决定上限，不硬凑。深渊 18 条、神之眼 29 条都是合理结果。"
  include: "能回答「这个概念是什么 / 怎么运作 / 有什么代价或例外」的句子"
  exclude: "纯描写（角色摸了摸神之眼）、比喻用法（人性的深渊、万劫不复的深渊）、版本说明字段（神之眼：雷）"
  source_priority: "设定类（book/artifact/weapon/lore/item）优先全收；quest/character/voice 只收长段落且含解释词"
  placement: "实体在 seed.yaml → 直接改 seed.yaml；在生成物批次（seed-stage3/4/5 等）→ 写 knowledge/evidence-overrides.yaml"
  verify: "load_knowledge.py 干跑必须「证据解析成功 N/N、无 ERROR」才 --apply"
  ordering: "按缺口比，但 concept > organization > event > deity > nation（nation 提及多是人名地名后缀，设定价值低）"

