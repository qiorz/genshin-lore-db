theories:
  # 推论层进度（knowledge/theories.yaml 是权威源）
  done:
    - theory.moon-sisters            # 23 证据 / 16 文档 / 6 类型 / 1 反证（第 26 步）
    - theory.hyperborea-winter       # 7 证据 / 4 文档 / 至冬严寒的传说成因
    - theory.sky-isle-and-celestia   # 7 证据 / 7 文档 / 2 反证 / 天理是造物主还是掠夺者
    - theory.vision-price            # 7 证据 / 6 文档 / 2 反证 / 神之眼是命运契约
    - theory.descender-variable      # 7 证据 / 6 文档 / 降临者=世界外的变数
    - theory.abyss-and-khaenriah     # 7 证据 / 7 文档 / 坎瑞亚窃取深渊后被反噬
    - theory.leyline-memory          # 6 证据 / 6 文档 / 世界树-地脉-记忆三层结构
    - theory.seven-archons-turnover  # 6 证据 / 5 文档 / 七执政是可更换的岗位
  remaining:
    - 冰之女皇的真实目的（证据仅 5 条，偏薄）
    - 虚空与禁忌知识的因果链（16+8 条，可做）
    - 稻妻三奉行分权 / 纳塔部族体系（中等质量）
  rules:
    - 每条推论必须能回答「原文没说透的地方」，不是把已知信息换个说法
    - 同一段不能引用两次（load_theories.py 会跳过并报错）
    - 反证/矛盾必须收，哪怕它不可靠（不可靠本身是线索）
    - evidence 四档：direct / implied / corroboration / counter

  updated_712:
    # 2026-11-13 增量同步 7.2 后，用新材料回头修的推论
    theory.hyperborea-winter:
      was: 7 条证据 / 4 篇文档
      now: 15 条证据 / 9 篇文档 / 6 种类型
      what_changed: >-
        7.2 新材料把这条推论从「传说里的温暖之地」升级成「有名字、有遗民、有造物行为的
        黄金之城」。关键新证据：遗民手记自称「黄金之城亥珀波瑞亚之民」，并给出另一套成因——
        「地脉变动导致黑色的晶灾如流吞没一切」，都城「沉入阴影浮流之地」；妖精是亥珀波瑞亚
        造的人造生命；遗民为躲避厄生晶矿流散各地；至冬人至今仍在尝试把温暖扩张回整片冻土。
      new_questions:
        - 「地脉变动」与「神罚」是同一场灾变的两种叙述，还是前后相继的两场
        - 「阴影浮流之地」是地名还是空间状态
        - 妖精从公民沦为蒙昧，遗民说「那么短的时间内」——记忆是否被外力压制

    # 新材料里还有一条尚不足以成论的线索（记为候选）
    candidates:
      - 晶灾机制：克什尼克晶矿 + 地脉被深渊入侵 → 厄生晶矿；以「晶核」为核心不断生长、
        汲取力量、引发大地震、吞没城市（quest.obc.510403「先使大地张开裂口」整条任务）
        待验证：它汲取的"力量"是否包括温暖/元素力——若是，则可能解释至冬变冷
      - 兽怪与妖灵的政治史：《至冬国通史补编》(book.obc.510320) 讲血王女雅莉亚涅、
        莫诺马赫皇帝、兽怪诸氏族。与"七位先存之神"血裔的线索可以接上

