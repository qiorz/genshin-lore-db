  evidence:
  # --- 本质与功能 ---
  - doc: quest.obc.533
    quote: 「神之眼」是这世上极少数人才拥有的外置魔力器官
  - doc: book.obc.521            # 丘丘人习俗考察
    quote: 元素的力量是只有通过「神之眼」才能发挥的
  - doc: char.obc.78             # 凝光
    quote: 而无主的「神之眼」的空壳，是使用者死后才会留下的东西
  - doc: char.obc.500673         # 闲云
    quote: 佩戴神之眼，以此为媒介驱使元素力也是易如反掌
  # --- 授予机制：愿望 → 神明注视 ---
  - doc: char.obc.508597         # 布伦妮
    quote: 只要愿望足够强烈，神明便会投下视线
  - doc: char.obc.500672         # 嘉明
    quote: 神之眼跟某种强烈的愿望有关
  - doc: char.obc.76             # 凯亚
    quote: 凯亚的「神之眼」，便是在此刻悄然降临
  - doc: char.obc.3875           # 神里绫人
    quote: 这颗「神之眼」在此时降临
  - doc: book.obc.503020         # 哈南帕查记事
    quote: 初代火神尚未诞生，因此也没有人拥有神之眼
  - doc: lore.obc.6104           # 轻策庄公告板
    quote: 请给小六一颗神之眼吧
  - doc: lore.obc.1008           # 蒙德百货订货板
    quote: 我要神之眼。然后，用神之眼帮助
  # --- 代价：与「命运」绑定；自以为是的危险 ---
  - doc: lore.obc.503105         # 笔记【水仙十字结社】
    quote: 获得神之眼是将自身出卖给世界的「命运」
  - doc: char.obc.6180           # 迪希雅
    quote: 只因为拥有神之眼便自以为受到神明注视
  - doc: char.obc.1433           # 甘雨
    quote: 「神之眼」，便是她的新责任与新见证
  # --- 熄灭与失去 ---
  - doc: char.obc.75             # 迪卢克
    quote: 「神之眼」中燃烧的期待与理想，都在那晚的暴雨中熄灭
  - doc: voice.obc.3347          # 土门
    quote: 虽然没了神之眼，以前的愿望是无法实现了
  - doc: quest.obc.1244          # 永无止境的研究
    quote: 还颁布了一条「眼狩令」
  - doc: lore.obc.5802           # 花见坂告示板
    quote: 老子不会忘记你夺我「神之眼」之恨
  - doc: char.obc.2142           # 枫原万叶
    quote: 本想借别人的手再次点亮这枚「神之眼」
  # --- 例外：没有神之眼也能强 ---
  - doc: weapon.obc.174          # 西风大剑
    quote: 艾伦德林未曾获授神之眼
  - doc: item.obc.4055           # 「薄缘满光天目」
    quote: 历代岩藏之胤不曾获得过神之眼
  - doc: artifact.obc.1983       # 苍白之火
    quote: 无论是否拥有神之眼，无论体质与武艺如何
  # --- 社会意义与衍生物 ---
  - doc: char.obc.507287         # 雅珂达
    quote: 当人们听说雅珂达拥有了「神之眼」后
  - doc: char.obc.75             # 迪卢克
    quote: 他们暗中仿造「神之眼」制作「邪眼」
  # --- 与其它物件的互动 ---
  - doc: item.obc.1208           # 口袋锚点
    quote: 对神之眼持有者而言，应当是非常便利的小物件
  - doc: item.obc.501099         # 碎星铁矿
    quote: 拥有和神之眼共鸣的力量
  - doc: book.obc.513            # 绝云记闻
    quote: 为携着「神之眼」的旅人引路
  # --- 元素类型与日常 ---
  - doc: event.obc.504692        # 游逸旅闻·诗汇之章
    quote: 虽然我们都没有「风元素」的神之眼
  - doc: book.obc.1158           # 残破的笔记
    quote: 这年头搞学术的人没有
