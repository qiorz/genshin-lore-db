      quote: 唯有「禁忌知识」被彻底解决，她才能放眼须弥的未来
    - doc: char.obc.5111
      quote: 「禁忌知识」被完全消除那一刻，「虚空」真正完成了它的使命
    # --- 赤王的迷途 ---
    - doc: book.obc.4626
      quote: 又将自己困于迷宫深处寻求深黑的禁忌知识
    - doc: book.obc.4626
      quote: 为了惩罚他们受惠于禁忌知识的罪恶
    - doc: char.obc.92
      quote: 无论是荒野妖异的禁忌知识

  # 奥赛尔：漩涡之魔神，被封印于孤云阁下
  entity.ao-sai-er:
    - doc: quest.obc.2247             # 原有
      quote: 不过说起来，他们想要对奥赛尔做什么
    - doc: quest.obc.3539             # 原有
      quote: 据凝光所言，那是奥赛尔的妻子，游荡在海中的跋掣
    - doc: quest.obc.501464           # 原有
      quote: 我记得，是说要改造魔神奥赛尔什么的
    # --- 身份 ---
    - doc: quest.obc.3538
      quote: 关于「漩涡之魔神」奥赛尔的收获寥寥
    - doc: quest.obc.3539
      quote: 一头身形巨大的怪物浮出海面
    - doc: quest.obc.2589
      quote: 令魔神奥赛尔也为之胆寒

  # 仙术：仙人使用的法术，凡人亦可习得
  entity.xian-shu:
    - doc: quest.obc.2840             # 原有
      quote: 他在渡海去璃月学了仙术之后，又回了稻妻
    - doc: quest.obc.501133           # 原有
      quote: 阿圆驱使仙术，对酒馆进行了一番改建
    - doc: quest.obc.5989             # 原有
      quote: 削月筑阳真君与理水叠山真君用仙术驱动起了机关

  # 虚假之天：遮蔽真实星空的天幕
  entity.xu-jia-zhi-tian:
    - doc: quest.obc.503380           # 原有
      quote: 关于「虚假之天」和空中的碎片
    - doc: quest.obc.505514           # 原有
      quote: 难道关于「虚假之天」
    - doc: quest.obc.506587           # 原有
      quote: 真正的「霜月」…在「虚假之天」
    # --- 定义：遮蔽真实星空 ---
    - doc: quest.obc.507438
      quote: 只有穿透虚假之天，宇宙星体的引力与影响才能被观测
    - doc: quest.obc.507438
      quote: 只有拥有这些世界外的参数，才能推算世界命运
    # --- 与三月女神 ---
    - doc: quest.obc.507425
      quote: 「葬火之战」结束后，三个月亮都去了虚假之天外面
    - doc: char.obc.507505
      quote: 霜月穿过虚假之天，留在了提瓦特

  # 愚人众执行官：十一席
  entity.yu-ren-zhong-zhi-xing-guan:
    - doc: char.obc.5494              # 原有
      quote: 至冬国愚人众执行官第六席，其称号为「散兵」
    - doc: quest.obc.3533             # 原有
      quote: 那个叫做达达利亚的人是「愚人众执行官」
    - doc: quest.obc.507425           # 原有
      quote: 愚人众执行官第二席，「博士」多托雷
    # --- 席位与称号 ---
    - doc: char.obc.501157
      quote: 正是如今的愚人众执行官第四席，「仆人」阿蕾奇诺
    - doc: char.obc.1220
      quote: 来自愚人众执行官「公鸡」的忠告
    - doc: char.obc.1220
      quote: 作为愚人众执行官的先锋，「公子」达达利亚
    # --- 与神明的关系 ---
    - doc: char.obc.501157
      quote: 作为愚人众执行官，阿蕾奇诺不向任何神明俯首

  # 机关术：璃月/须弥的机械技艺
  entity.ji-guan-shu:
    - doc: quest.obc.500776           # 原有
      quote: 她擅长机关术，也精通各类仙家符箓
    - doc: quest.obc.505878           # 原有
      quote: 《古典机关术概论》
    - doc: quest.obc.677              # 原有
      quote: 您是不是为了研究「机关术」
    # --- 传承与人物 ---
    - doc: char.obc.500673
      quote: 除了精通机关术，擅长做各种小玩意之外
    - doc: char.obc.500673
      quote: 留云借风真君酷爱钻研机关术，甚至到了痴迷的程度
    - doc: char.obc.5493
      quote: 惟望前辈回归教令院时，后世学生犹记珐露珊之名
    - doc: char.obc.5493
      quote: 要是有哪门机关术考试未能及格

  # 花神诞祭：须弥纪念花神的节日
  entity.hua-shen-dan-ji:
    - doc: quest.obc.509534           # 原有
      quote: 梦境不能解释一切，这里也不是「花神诞祭」
    - doc: quest.obc.5299             # 原有
      quote: 就是一场漫长的「花神诞祭」
    - doc: quest.obc.6044             # 原有
      quote: 就是我连续过了好多好多次「花神诞祭」吧
    # --- 节日形态 ---
    - doc: char.obc.5111
      quote: 花神诞祭是属于大家的节日
    - doc: char.obc.5020
      quote: 应该要我本人到场
    - doc: voice.obc.5271
      quote: 就在花神诞祭期间，也给草木们放个假吧

  # 三十人团：受教令院雇佣的须弥佣兵
  entity.thirty-men:
    - doc: lore.obc.501738            # 原有
      quote: 如需雇佣保镖、守卫，亦或其他委托，请联系「三十人团」驻奥摩斯港队
    - doc: quest.obc.6044             # 原有
      quote: 佣兵，你是「三十人团」的吧
    - doc: quest.obc.7647             # 原有
      quote: 「三十人团」受教令院雇佣，负有护卫整个须弥城的责任
    # --- 职能 ---
    - doc: voice.obc.504682
      quote: 协助教令院的相关机构、配合「三十人团」
    - doc: voice.obc.6299
      quote: 因为就在教令院的眼皮底下，还有我们「三十人团」驻守
    - doc: voice.obc.6297
      quote: 你说的是那位「三十人团」的向导吗
    - doc: voice.obc.6213
      quote: 感觉日子也比以前在「三十人团」里时过得长了

  # 降临者：来自世界之外的「变数」
  entity.descender:
    - doc: lore.obc.507822            # 原有
      quote: 同世界的「变数」（即「降临者」）相连接
    - doc: quest.obc.506587           # 原有
      quote: 我是提瓦特之外来的「降临者」
    - doc: quest.obc.507699           # 原有
      quote: 「降临者」，我来为你展现世界
    # --- 影响 ---
    - doc: quest.obc.506587
      quote: 三位月之女神在一场因「降临者」引发的战争中尽数逝去
    - doc: artifact.obc.508651
      quote: 新到的降临者又为何筑起拘束生命的天壳
    - doc: quest.obc.507699
      quote: 多托雷抓他/她，多半也是因为其降临者的身份

  # 演武传心：稻妻的剑道赛事，社奉行承办
  entity.yan-wu-chuan-xin:
    - doc: quest.obc.501450           # 原有
      quote: 直到此前的「演武传心」，在下略逊宏达前辈
    - doc: quest.obc.6103             # 原有
      quote: 「代神使」是「演武传心」中一项很特殊的职责
    - doc: quest.obc.6107             # 原有
      quote: 「演武传心」表演赛马上就要开始了
    # --- 赛事组织 ---
    - doc: quest.obc.6103
      quote: 刚才动手，只是为了角逐「演武传心剑道大赛」的参赛资格
    - doc: quest.obc.6103
      quote: 「承办方社奉行」
    - doc: quest.obc.6105
      quote: 像「演武传心」这样有稻妻特色的赛事
    - doc: quest.obc.6105
      quote: 公告板上演武传心服装投票的几个选项

  # 璃月：nation 补证据示范——从专题文档（璃月风土志）提取，而非按名字扫全库
  entity.liyue:
    - doc: voice.obc.2021             # 原有
      quote: 全提瓦特流通的货币「摩拉」是由璃月的「黄金屋」所铸造
    # --- 风俗：绣球 ---
    - doc: book.obc.606               # 璃月风土志
      quote: 在璃月，新人的婚礼仪式上，新娘会将一束绣球抛向前来参加婚礼的宾客
    - doc: book.obc.606
      quote: 有人认为是受到邻国「风之国」蒙德羽球节习俗的影响
    - doc: book.obc.606
      quote: 也有人认为起源于魔神战争之前，「盐之魔神」漫步璃月大地的时代
    - doc: book.obc.606
      quote: 她的葬身之地很可能位于如今被璃月人称为「地中之盐」的遗迹之内
    - doc: book.obc.606
      quote: 在璃月千岩军的安全记录中，每年哄抢绣球造成的受伤情况不在少数
    # --- 政教：岩神与七星 ---
    - doc: book.obc.606
      quote: 作为始终注视守护璃月大地的神明，岩神每年会亲自降临
    - doc: book.obc.606
      quote: 代表璃月港各工商产业的「七星」成为了璃月港凡民与岩神之间的媒介
    - doc: book.obc.606
      quote: 璃月港的商人也会尽可能地或亲自、或差人急速赶回家乡
    # --- 国民性 ---
    - doc: book.obc.606
      quote: 而在磐岩的国度，人们却惯于祈求神明慷慨的引导，用以巩固繁荣的世俗

  # 蒙德：nation 方法——取《蒙德高塔》(book.obc.502)
  entity.mondstadt:
    - doc: quest.obc.399              # 原有
      quote: 它们是蒙德四方之风的守护者
    # --- 贵族时代与高塔 ---
    - doc: book.obc.502
      quote: 在久远的贵族时代，蒙德城广场上矗立着一座高塔
    - doc: book.obc.502
      quote: 实际上却只是贵族们宣示自身权力的标志
    # --- 风神与自由 ---
    - doc: book.obc.502
      quote: 风神巴巴托斯从来鼓励人主动追寻所爱，投身自由
    - doc: book.obc.502
      quote: 但在那个风神沉眠的压抑时代
    # --- 庆典与魔龙 ---
    - doc: book.obc.502
      quote: 这年的羽球节，高塔上出现了一位美丽的异域少女
    - doc: book.obc.502
      quote: 他在幼时曾经被市民当成引来魔龙肆虐的噩兆

  # 至冬：nation 方法——取《至冬国通史》(book.obc.509470)
  entity.snezhnaya:
    - doc: quest.obc.533              # 原有
      quote: 被至冬国的女皇赐予了神灵般的权柄
    # --- 女皇与国体 ---
    - doc: book.obc.509470
      quote: 献给全至冬的女皇，苍星永恒的统御者
    - doc: book.obc.509470
      quote: 上溯极夜时代的传说，中叙莫诺马赫皇帝的征战
    # --- 地理：曾气候温暖 ---
    - doc: book.obc.509470
      quote: 这片如今被称作「至冬」的、为银雪荫覆的广袤冻土
    - doc: book.obc.509470
      quote: 相反，此地曾气候温暖
    - doc: book.obc.509470
      quote: 他们筑起的城邦像黄金那样光辉耀眼
