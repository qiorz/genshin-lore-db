# 证据覆盖 · 生成物批次里的实体
#
# 为什么需要这个文件：
#   第 3–5 批实体由 build_stage4/5.py 生成，不能手改（改了下次重跑就没了）。
#   但这些实体往往只有 1–2 条机器抓的证据，而正文里线索可能散在几十篇文档。
#   本文件用来覆盖指定实体的证据列表，与种子文件互不干扰。
#
# 规则：
#   1. 覆盖是【整体替换】——必须写出完整列表，含原来那几条，否则旧证据会被删掉；
#   2. 只处理 entity_evidence，不改实体字段（name/description 等仍以种子为准）；
#   3. 每条证据都必须能在 corpus 里找到原话，灌库时逐条校验；
#   4. 不存在的 entity_id 会报错，不会静默跳过。
#
# 复跑：
#   tools/python/python.exe scripts/load_knowledge.py            # 干跑校验
#   tools/python/python.exe scripts/load_knowledge.py --apply

version: 1
batch: 2026-11-12-evidence-overrides

