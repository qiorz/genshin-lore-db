# 暗示清单：文本中的影射、寓言对应、戏中戏
#
# 判读规则（2026-11-13 定）：
#   1. 只记录「能指出具体文本依据」的对应关系，不采信无出处的社区传言；
#   2. 每条必须给 doc + quote（引文要能在该文档解析到段落）；
#   3. confidence 三档：
#        explicit  —— 原文自己点明（如「这本书讲的就是 X」）
#        strong    —— 多处细节吻合，且无更简单的解释
#        tentative —— 有若干细节吻合，但存在其他解释
#   4. 童话/寓言/舞剧/诗歌是暗示高发区，但**不是所有故事都有影射**，
#      纯设定故事（如地区风物集）不强行附会。
#
# 数据源缺失（重要，避免误判「文本没写」为「没有暗示」）：
#   - 《白之公主与六侏儒》观测枢与 BWiki **都只有卷一全文**，卷二至卷七仅简介。
#     用户指出该童话影射戴因与五罪人，但全书正文不可得，目前无法在语料内验证。
#     卷一留下的抓手：夜之国/夜母/月光森林/白皙肌肤浅发蓝眼的居民——
#     「夜母既无口也无心」「最痛恨自外而来穿透黑墙的光明」。
#   - 判据：书籍可用字数 A(>=2000) 56 本、B(600-1999) 32 本、C(<600) 7 本。

allusions:
  - id: allusion.witch-society-marginalia
    doc: book.obc.503016
    title: 小魔女与不熄灭的火（边注）
    surface: 魔女会集体创作的童话，讲小魔女通过「魔女资格考试之终阶试炼」。
    target: 魔女会成员的真实互动（艾莉丝、代号 R、冰之女皇）
    confidence: strong
    basis: >-
      各卷「描述」与正文前的神秘笔迹是**作者之间的对话**，而非故事内容：
      「我的女皇陛下啊，这么多伏笔怎么回收啊。可怜可怜我这个老人家吧。」
      「艾莉丝一定也是这么想的：如果不继续，那么一开始…」
      「难得 R 她神智正常了一段时间，真的要她用珍贵的清醒时间写这个吗？」
      「你懂什么！而且这些不是设定，是杂学与博物！」
      这些句子明确指向魔女会内部（艾莉丝为可莉母亲、成员以代号互称），
      属于「书中书」式元叙事，可据以确认魔女会的创作方式与成员构成。
    caveat: >-
      这是「作者身份」层面的暗示，不是故事情节影射现实人物。
      故事本身（小魔女试炼）尚无证据对应具体事件。
    status: open

  - id: allusion.snow-goose-collection
    doc: book.obc.500416
    title: 雪翅雁童话集
    surface: 企鹅佩伊想学飞，先后求助军舰鸟、海鸥、海燕，均被推诿或拒绝。
    target: 无（判为纯儿童故事）
    confidence: explicit
    basis: >-
      开头虽写「所有企鹅都来自高远莫测的天穹之外…光滑的身体曾反射着恒星的光芒」，
      但这与企鹅生物学特征（退化的翅膀、脂肪层）形成的是**幽默解释**，
      后文即转入纯粹的学飞寓言。全文没有可对应到具体设定名词的细节。
    caveat: 依「不强行附会」规则记为纯童话，不计入影射。
    status: rejected

  - id: allusion.boar-princess
    doc: book.obc.625
    title: 野猪公主
    surface: 森林王国的公主与两只狼在冰封荒原上的冒险，主题为「友情、爱与生死」。
    target: 无（判为纯童话）
    confidence: explicit
    basis: >-
      作者署名为「魔女会-代号M-安德斯多特」，是游戏内虚构童话。
      情节元素（乌龟老爷爷、寒冰诅咒、幼狼身世）均可自洽解释，无对应现实人物的细节。
      书中夹带的儿童便条（「我每天晚上乖乖不吃糖…也会变成耶猪吗」）进一步坐实其"童书"属性。
    caveat: 不计入影射。魔女会署名本身已在 allusion.witch-society-marginalia 中覆盖。
    status: rejected


  - id: allusion.frostmoon-liturgy-hiatus
    doc: book.obc.506481
    title: 终北祷歌集（霜月之子礼制）
    surface: 霜月之子世代流传的祷歌与祭礼规程，由执祭安洛丝编纂。
    target: 霜月之子信仰体系，及其在「五百年前」遭遇的礼制断裂
    confidence: strong
    basis: >-
      每条祭礼后都有执祭安洛丝的同款备注：「依循最初的咏月使爱依菈的谕令，该祭礼已在五百年前被废止」，
      并改为简化版（如「愿新月照亮你的前路」「愿新月引你抵达安宁的彼岸」）。
      这说明霜月之子在五百年前经历过一次自上而下的礼制改革，而五百年前正是坎瑞亚灾变的时间点。
      另有三处值得追踪的专名：最初的咏月使「爱依菈」、「七重灾厄的神明」、祭祀中单列供奉的「冥府的女主人」。
    caveat: 「五百年前废止」与坎瑞亚灾变的因果关系是我据时间点并置推出的，原文未明言是受灾变影响。
    status: open

  - id: allusion.unreliable-narrator-warning
    doc: book.obc.501
    title: 林间风（叙事诗集的自述）
    surface: 学者整理的蒙德无名游吟诗人诗篇集，讲述风龙、温妮莎、废墟等故事。
    target: 文本自身的可信度警告（元叙事）
    confidence: explicit
    basis: >-
      书中直接写下：「游吟诗人的歌谣为了赚取听众与摩拉，往往言过其实或者捏造歪曲历史，
      大部分内容可信度很低。但是瑰丽的想象与才华横溢的修辞，穿越了时间千风，使之流传至今。」
      这段话是游戏在借学者之口提醒读者：**诗歌体裁的设定陈述不能直接采信**。
      同时该书又确实记载了「黑日王朝覆灭…被称为『黄金』的炼金士堕落为了罪人…杜林从海上升起」
      这类与史实吻合的内容，说明它不可靠的是细节与夸张，而非全部框架。
    caveat: >-
      这是一条「读书方法」层面的记录，不是人物影射。它影响所有以诗歌/传说为载体的证据定级——
      同类文本（如《碎梦奇珍》《极星舞剧集》）里的设定陈述应降一档看待。
    status: open

  - id: allusion.elf-vs-human-historiography
    doc: book.obc.507746
    title: 苍星妖灵史略（妖精视角的至冬史）
    surface: 妖精年长者所著的至冬/基捷开国史，记莫诺马赫皇帝与兽怪联盟大君王穆斯季斯莱沃的百年争战。
    target: 同一段至冬早期史的「妖精叙述」与「人类叙述」之差异
    confidence: strong
    basis: >-
      本书用妖精纪年（「第四百二十八纪」），立场明显偏向苍星王廷：把莫诺马赫皇帝写成
      「以其无限的恩泽与仁慈」者，把对手穆斯季斯莱沃写成挑起战争的野心家，
      还专门用一整段（「仁爱」条）去辨析古籍词语的译法，为皇帝的贡物索求做辩护。
      而同为至冬史的《至冬国通史》是人类学者编纂、以「献给全女皇」开篇的宫廷史书。
      两书对同一人物（莫诺马赫、穆斯季斯莱沃、基捷建城）的褒贬与动机解释不同，
      构成一组可对照的「敌对史观」样本。
    caveat: >-
      这不是「A 影射 B」，而是「同一事件存在两套叙述」——分析方法应参照
      theory.hyperborea-winter 里「神罚说 vs 地脉变动说」的处理方式，两说并存、不强行调和。
    extra: >-
      另有一处值得追踪：记载穆斯季斯莱沃王在最后一战中「尝试利用了阴影世界的力量以拖延
      苍星王廷的进军」——「阴影世界」未见于其他文本，疑指深渊，但无直接佐证，暂不作断言。
    status: open

  - id: allusion.golden-civ-witness
    doc: artifact.obc.508652
    title: 影中沉凝的幻灭（圣遗物故事·黄金文明目击）
    surface: 华发如银的少女（后为「影中的法师」）随北国皇帝赴雪精山中之馆，后随学者进入黄金文明废墟。
    target: 黄金文明（疑即亥珀波瑞亚）覆灭后的现场，以及雪精/矮灵等「仆从种族」的身份
    confidence: strong
    basis: >-
      三处关键细节：① 雪孃王公自陈「你所见的只是转瞬即逝的光影，刻写于我等昔日为奴的血脉」
      并说「可竟是古老的仆从仍然能使得这样的戏法，而一度作主的人类再也无法复现旧时的…」——
      说明雪精一类存在曾是「仆从」，而人类曾「作主」，如今主客易位。
      ② 学徒「目睹一度辉煌的黄金文明，经受摧残后的结局…停滞于时空，高塔与城堡如身躯残破的
      巨人，而大地是张开着泣血的裂口」，并称之为「苍穹主人至大伟力残存于世的一次重击」。
      ③ 学者明知「前人曾行过，而那路途的竟终是毁灭」仍执意深入，所做的正是「某项不可为的事项」。
    caveat: >-
      原文只说「黄金文明」，未直接写「亥珀波瑞亚」四字；「疑即亥珀波瑞亚」是我据
      「黄金之城」「高塔倾倒」等共同意象作的关联，属推测，故 target 写作「疑即」。
      若日后找到该书与亥珀波瑞亚的直接桥梁，可升为 explicit。
    status: open

  - id: allusion.khaenriah-crimson-to-black
    doc: book.obc.501063
    title: 裴伦埃里（坎瑞亚传奇·赤月到黑日）
    surface: 坎瑞亚家喻户晓的传奇故事，经数代集体创作，讲少年裴伦埃里在地下王国的成长。
    target: 坎瑞亚王朝「赤月→黑日」的交替，及王国收容「世界之外来客」的制度
    confidence: strong
    basis: >-
      两处硬信息：①「相传那个时候家禽与野鸟还没有分开。那个时候，照亮地下王国的是一轮赤月，
      而不是后来的黑日。」——直接点出坎瑞亚存在过两个王朝时代，赤月在前、黑日在后，
      与 BWiki「赤月王朝→黑日王朝」的整理一致。②「因为王国位置特殊，总有世界之外的事物漏入
      其中…比如说，或许来自某个毁灭世界的孩子？」以及「期待着自所谓的海洋之外而来到王国的神
      ——或者说能够超越神的人，他们建立了收容这种孩童的机构」——说明坎瑞亚有系统性收容
      外来者后代（含「毁灭世界的孩子」）的机构，动机是等待「能够超越神的人」。
    caveat: >-
      本书自述「初版作者自称改编自坎瑞亚家喻户晓的传奇故事，但是世上已经没有人可以佐证…
      现在已经是数代人的集体创作了」——属**不可靠叙事**，细节（如爬甬道）不可尽信；
      但「赤月/黑日」与「收容机构」这类制度性信息，与 BWiki 整理及游戏内其他文本吻合，可采。
      另：这批「被收容的孩子」是否为「五罪人」的来源，语料内尚无直接连接，不作断言。
    status: open

  - id: allusion.moons-new-covenant
    doc: artifact.obc.507648
    title: 晨星与月的晓歌（三月与人类的「新约」）
    surface: 以「古时空月女神塑像上的花饰」为由头写的圣遗物故事，实为三月女神与人类的立约叙事。
    target: 三月女神崇拜的起源，及其与天理「秩序」的对立关系
    confidence: explicit
    basis: >-
      文本给出完整因果链：①「牵引着原初天球的银轮，其数量依旧为三」——三月并存的时代，
      且「高天所降下的律法尚未结集，人理的边界亦尚未划定」；②「神的使者为凡人的愚妄而震怒，
      面对他们的疑问，御使们缄默不言」——天理一方拒绝回答人类的疑问；
      ③「于是人们转而望向天空，在日光不及的黑夜中为三轮皓月献上祭礼」——人类转投三月；
      ④「她们将疯狂与灵感带回月下，那是『秩序』无法给出的回答」——三月提供的正是天理不给的；
      ⑤「这枚『月之轮』，便是三月与众民订下的新约」——月之轮是立约信物。
      这直接解释了「月之轮」的性质，也与 theory.vision-price 中「神之眼前身＝月之轮、
      获取后即卖身于命运」的记载衔接。
    caveat: >-
      同段后文出现「脚踏晨星、高居月上的有翼者，成为了永恒天的主宰」「蛋壳中的世界之主用
      虚假的帷幕隔绝真实的魔天」——「有翼者」与「世界之主」指谁（法涅斯？天理？）需另考，
      此处不并入本条的立约叙事。
    extra: >-
      文本还透露三月的职能范围：「在阿兰若国的酣息中，在七十层的阶梯下，在银璨璨的舫舻边」——
      「七十层的阶梯」「舫舻」皆为新意象，可作后续追踪点。
    status: open

  - id: allusion.seelie-origin
    doc: book.obc.513
    title: 绝云记闻·山灵（仙灵的起源）
    surface: 璃月志怪集的一篇，讲山林间无主仙灵为何给人引路。
    target: 仙灵（天使）的起源——与外来旅人立约、灾祸、形体崩碎、退化为引路小灵
    confidence: strong
    basis: >-
      文本给出完整链条：①仙灵「曾是比诸多仙人更加古老的存在，拥有优美的形体与伟大的智慧」，
      年代「甚至早于岩王帝君与诸多魔神厮杀的时代」；②「仙灵的先祖与外来的旅人相识，
      于月宫三姐妹的见证中立下了结合的誓言」——三月女神是见证者，对象是「外来的旅人」；
      ③「仅三十日后，灾祸遽起…无情的惩罚令他们永久离散，甚至就连记忆也支离破碎」；
      ④「美妙的形体也崩落碎裂…化为了飘散的小小生灵，它们失去了自己的声音与智慧，
      但依旧唱着哀伤的歌」；⑤因此它们「引导着山林云雾间驻足的旅人」，即今日的引路仙灵。
      此说与 BWiki 整理「天使爱上外来者，三月见证立约，三十日后灾祸，天使为使用禁忌知识的
      人类求情而被散失形体、成为仙灵」在结构与数字（三十日）上一致。
    caveat: >-
      作者在篇末主动否定了这个故事：「当然，这些仅是散乱离奇的传说，是璃月乡间对岩王帝君之前
      悠古时代的虚妄幻想，缺乏采信的价值。」——这是**文本自带的可信度警告**，
      与 allusion.unreliable-narrator-warning 同类。故本条虽细节吻合度高，仍不宜升为 explicit。
    extra: >-
      值得注意的差异点：「灾祸」与「惩罚」在此篇中被合并叙述，未区分「灾祸」（天崩地裂）
      与「惩罚」（散失形体）；而 BWiki 的整理把它们拆成两步（先灾祸后求情受罚）。
      这个拆合差异会影响「天使受罚的原因」的判断，留作待考。
    status: open

  - id: allusion.primordial-and-three-shadows
    doc: book.obc.3470
    title: 白夜国馆藏（渊下宫创世叙事）
    surface: 渊下宫（白夜国）的典籍合集，含对「天上永恒王座到来」与创世的记述。
    target: 法涅斯创世、七龙王之战、以及「原初的那一位 + 三位发光的影子」这一执政结构
    confidence: explicit
    basis: >-
      这段文本把创世讲得很实：①「天上永恒的王座到来…原初的那一位开始和旧世界的主人们，
      七位恐怖大王开战。那恐怖的大王们是龙」；②「原初的那一位，或许是法涅斯。它生着羽翼，
      头戴王冠，从蛋中出生」；③「法涅斯…用蛋壳隔绝了『宇宙』和『世界的缩影』」——
      蛋壳即虚假之天；④「四十个冬天埋葬了火，四十个夏天沸腾了海。七位大王全部被打败」；
      ⑤「原初的那一位和一位影子制造出了飞鸟、走兽和水鱼…最后它们造出了人」；
      ⑥「原初的那一位和其他三位发光的影子」。
    caveat: >-
      **本条用于更正我此前的判断**：我曾以「原初四影」四字在 47 万段中 0 命中为由，
      将其判为社区概括、不予采信。但第 ⑥ 句「原初的那一位和其他三位发光的影子」
      正是同一结构（1 位原初 + 3 位影子 = 四），说明 BWiki 的「原初四影」**有本地依据**，
      只是原文不用这个词。结论应改为：「原初四影」是社区对该结构的命名，事实成立，命名非原文。
    extra: >-
      同书另有三条可追踪：①「王是原初的那位之化身」「祭司乃是常世大神的化身」——
      渊下宫的王权与神权各有其「化身」来源；②「根据预言，水之龙王会以人形诞生」——
      与那维莱特的人形呼应，但此预言在渊下宫语境下；③「方圆之地就崩落进了深渊」——
      地理灾变与深渊的关联。
    status: open

  - id: allusion.khaenriah-sinful-monk
    doc: artifact.obc.506178
    title: 穹境示现之夜（坎瑞亚·妖僧拉乌斯万格）
    surface: 圣遗物故事，讲地下王国的学僧拉乌斯万格窥见「焚真之镜」中的漆黑乐园，被判流放。
    target: 坎瑞亚「深秘院」的星象研究、「罪人」概念、以及背弃神明者所受的诅咒
    confidence: strong
    basis: >-
      开场即点题：「那是**罪人们**尚未铸成大错的年代，地底构筑的属世王国深处」——
      说明坎瑞亚存在被后人称为「罪人」的群体，且他们的「大错」发生在故事之后。
      其余硬信息：①王国人「不曾见过大海，当然也从未目睹过真正的太阳」；
      ②他们「并非仰望星空，而是在镜面虚假的倒影中寻觅真实」，由此记录「渴真之天象」；
      ③「久到地上的神明纷纷陨落，久到黑日取代了赤月」——再次确认王朝更替顺序；
      ④「已有人知晓了深罪的秘密，因此窥探星空也成为了禁忌的知识」，
      仅少数人「享有逾越禁令的特权，以便为**独眼的君王**服务」；
      ⑤拉乌斯万格因一瞥「漆黑乐园」而被逐出深秘院、判流放，
      且「那施加于背弃神明之人的古老诅咒，一旦回到地上便会追赶上他」——
      即**流放地上＝让诅咒追上**，这是坎瑞亚的刑罚逻辑；
      ⑥但「唯独他身上却是什么也未发生」，疑似「穹境中的伟大存在…亲自从芸芸众生中拣选了他」。
    caveat: >-
      文中「罪人们」是否即 BWiki/社区所称的「五罪人」，本书**未给出数量与名单**，
      只说「尚未铸成大错」。故本条确认「罪人」这一群体存在，但不据此认定其成员。
      「独眼的君王」「深秘院」「焚真之镜」为三个首次出现的专名，值得单列追踪。
    extra: >-
      同时收束了 theory.abyss-and-khaenriah 缺的一环：坎瑞亚不是单纯「窃取深渊」，
      它先有**官方特许的星象研究**（为君王服务），后才有人越过禁令去看「深罪的秘密」——
      「禁忌知识」的吸引力在此有具体的人物动机（拉乌斯万格一瞥即献出全部心智）。
    status: open

  - id: allusion.angel-betrayal-and-voidmoon-envy
    doc: artifact.obc.504793
    title: 深廊终曲（天使的背叛与空月的僭越）
    surface: 圣遗物「深廊终曲」，以少女北行寻秘藏为框架，复述最初的天使与外来少年立约的一幕。
    target: 天使为何背弃天理、与凡人结盟；空月女神为何「暗生僭越之心」
    confidence: explicit
    basis: >-
      这段文本以近乎第一人称的方式给出了立约现场：①少年「步入大地至深之处」，
      与「最初的天使相见，问及世界最为禁忌的起源」，并将「自身的来历毫无保留地向她袒露」；
      ②天使的「桎梏顷刻如蛛网裂散」，她「初次寻得何为自我」，遂「将所有不可言及的秘密中
      最禁忌的创造之事，对所爱者全无顾忌地倾吐」——**创造之事**即造物之权；
      ③她宣言「就让我与你的律法为敌」「那便让我成为你的剑，你的盾，你的引路人，
      你不可饶恕的**悖逆共谋**」；④「众天使中最尊贵的那一位俯身轻吻他的前额，
      苍冷的银树绽出万千冰蕊」；⑤「彼时自云隙俯瞰大地的**空月见证了这一背叛，
      却暗生出更为僭越的心意**」。
    caveat: >-
      第 ⑤ 句是本条最值得注意的新线索：它把**空月女神**写成「见证背叛后心生嫉意」的一方，
      而非单纯旁观者。这与 theory.hyperborea-winter 里「霜月女神垂泪引遗民」的慈悲形象形成
      张力——三月女神内部对「天使与凡人立约」的态度可能并不一致。但原文只说「更为僭越的心意」，
      未明言内容，不宜过度推测。
    extra: >-
      同书末段还确认了记述者与龙主的关系：「早在终北的子嗣编织起沉沦的美梦之前，
      便有以灵智漫行于星间的旅者，与**尚未堕入浊黑的龙主**立下重逢的誓言」——
      「尚未堕入浊黑」四字，为「尼伯龙根后期被深渊污染」提供了时间锚点。
      另「血魇魔」为首次出现的种族名。
    status: open

  - id: allusion.monk-stole-voidmoon-power
    doc: artifact.obc.504792
    title: 长夜之誓（妖僧、空月之力与挪德卡莱）
    surface: 圣遗物故事，串起北国边地的征战、妖僧献计、特遣军誓约与「铸灯者」家系。
    target: 妖僧（拉乌斯万格）窃取空月之力、妖灵沙皇、月童分裂、狂猎灾厄
    confidence: strong
    basis: >-
      核心一句：「而为了窃取**空月所遗落的力量**，**说方言的妖僧**向**众妖灵的沙皇**献上毒计。
      隐于山林的**月童们**因此分崩离析，同胞的姐妹受命运驱使踏上歧途之路。」
      「说方言的妖僧」与 artifact.obc.506178《穹境示现之夜》中被「漆黑乐园」拣选的
      拉乌斯万格高度吻合（同为「妖僧」、同与禁忌知识相关），故两条可互证：
      **坎瑞亚出身的妖僧，把目标转向了空月女神遗落的力量，并借妖灵沙皇之力实施。**
      其余要素：①「狂猎」——自异界而来的索命魔军，或被目为「古老噩梦遗留的幻影」；
      ②「特遣军…向白磷色的苍星起誓，只为了创造无垢的新世界」——女皇军队的意识形态；
      ③「最初的铸灯者来自极北的冬都，夜莺的徽记…本是作为暗探效力的家族，
      却因**冬沙皇**的恩赏而得以荣膺缙绅之位」——至冬存在「冬沙皇」与「妖灵显贵王廷」；
      ④「在挪德卡莱最黑暗的年代里」——挪德卡莱的灾变期。
    caveat: >-
      「说方言的妖僧」是否确为拉乌斯万格，文本未点名，属跨文档比对得出的同一性推断，
      故定 strong 而非 explicit。若日后找到直接指名（如「拉乌斯万格」出现在至冬文本中），可升级。
    extra: >-
      本条首次给出「空月遗落的力量」这一具体标的——空月女神在三月体系中本就与
      「他对月亮的嫉妒」线（allusion.angel-betrayal-and-voidmoon-envy）相连，
      两条合并看，空月是三月里被反复争夺的一方。
    status: open

  - id: allusion.aeyra-and-promised-heir
    doc: artifact.obc.506172
    title: 纺月的夜歌（爱依菈、背叛的姐姐与「圣选之嗣」预言）
    surface: 圣遗物「纺月的夜歌」，讲霜月女神垂泪引遗民之后，终北一脉等待「圣选之嗣」诞生的漫长擘划。
    target: 第一位咏月使爱依菈的身世、她的姐姐、以及「君临乐园的圣选之嗣」预言
    confidence: explicit
    basis: >-
      三重信息：①爱依菈的身份——「日后被尊为**第一位咏月使的爱依菈**」，她本是
      「原本不应成为受福之人的、以**残次品**之名诞生的姐妹」之一，与姐姐相依为命，
      「既然从出生的那一天开始，就只有我们两个人陪伴着彼此」；
      ②姐姐的背叛——「许多年后，其中一人背弃了当初许下的约定，孤身行往远方，
      那并非是遁入故事中澄澈的晴空，而是**没入了更深暗的夜色**」，爱依菈「自此承受起双倍的折磨」；
      ③终北的擘划——「自迁灭之时以降，无数世代传续的擘划即将迎来完遂的时刻。
      **千载纯化的血脉**，终于要诞下那**预言中君临乐园的圣选之嗣**。高天虚假的七重光
      必俯伏在她的脚前，地骨也必转去跟从她」；④转折——「直到那本应诞下圣嗣的少女
      在**无月的雪夜与北国的少年相逢**，在他那双清澈如冬日的眼瞳中，望见了自己从未知晓的倒影」。
    caveat: >-
      本条解答了 book.obc.506481《终北祷歌集》里悬着的「最初的咏月使爱依菈」是谁，
      也解释了「五百年前废止祭礼」的谕令者身份（一位承受双倍折磨、仍主持礼制改革的咏月使）。
      「北国的少年」是谁、与「圣选之嗣」计划如何收场，本节未明，留作待考。
    extra: >-
      「高天虚假的七重光」是新表述——「七重」与七执政、七龙王、七重灾厄同数，
      但此处作「虚假的」定语，疑与虚假之天相关，暂不合并推理。
    status: open

  - id: allusion.izmeloh-forbidden-plan
    doc: artifact.obc.509293
    title: 炉火融炼之心（伊兹梅洛与「绝密计划」）
    surface: 圣遗物故事，讲基捷城的年轻矮灵伊兹梅洛被选入一项「绝密计划」。
    target: 至冬在「苍白皇帝被吞噬」之前就已开始的、对黄金时代遗物的打捞与研究
    confidence: strong
    basis: >-
      ①时间锚点：「彼时，距**冰雪之国苍白的皇帝被漆黑的浊流吞噬**，还有很长一段时日」——
      给出「白皇→被深渊吞噬」的事件，且故事发生在其之前；
      ②计划内容：「在后来生长白桦的宫殿的深处，**追寻禁忌的人们自阴影的世界打捞遗物**。
      他们拆解和分析**黄金时代**留下的一切，寻找所有拯救世界的方向和可能」——
      至冬官方在系统性研究黄金时代（疑即亥珀波瑞亚）的遗物；
      ③人物：招募者是一位「**华发的学者**」，与 artifact.obc.506178《影中沉凝的幻灭》中
      那位「华发如银的学者」（后为「影中的法师」）高度吻合，两条可互证为同一人物。
    caveat: >-
      「华发的学者」跨书同一性属比对推断（未点名），故本条定 strong。
      「黄金时代」是否即亥珀波瑞亚，原文仍用泛称，沿用《影中沉凝的幻灭》的谨慎处理。
    status: open

  - id: allusion.purewater-knights-vs-golden-tyrant
    doc: artifact.obc.500421
    title: 昔时之歌（纯水骑士反抗「黄金僭主」）
    surface: 圣遗物「昔时之歌」，讲枫丹古时「众水尚未汇流」年代的誓约与战火。
    target: 枫丹古代「黄金僭主」与「纯水骑士」的对立，及「万水之主」神启的来源
    confidence: strong
    basis: >-
      核心阵营对立：「众水尚未汇流的年岁，**黄金的威权**曾如汹涌的海潮漫卷，钢铁军团所至之处，
      蛮族尽皆臣服」，其秩序由「调律师」阶层维护；反抗者则是「被后世传颂为**纯水骑士**之人：
      以羸弱的血肉之躯，意图反抗遮天蔽日的黄金大权」，誓词为「誓要将那**黄金的僭主**逐出高海，
      誓要用血泪洗净不义者」「誓要守护来自**纯水的精灵**，誓要守护**万水之主**遗留的恩赐」。
      另有一条个人悲剧线：无名的少年乐师与部落歌女以「蝶翼的羽饰」定情，重逢时
      「袒露身份之刻，迎向他的唯有如湖光般的锋刃」，歌女说「是那**受诅的僭主**亵渎了你的灵魂，
      囚你于石牢间」。
    caveat: >-
      「黄金僭主」「调律师」「万水之主」三名皆未与现有实体直接对应：
      「万水之主」疑指前代水神厄歌莉娅一侧，但本段只说「神启」未点名；
      「黄金僭主」是否与「黄金文明/亥珀波瑞亚」同源，证据不足，不作合并。
    extra: >-
      该圣遗物套装的其余部件还给出：旧日之人有「鸣钟的传统」，
      「在黄金之衾覆盖天穹的终末之刻，钟声亦为毁灭而鸣」——「黄金之衾覆盖天穹」
      与「虚假之天/蛋壳」意象相近，值得并置观察。
    status: open

  - id: allusion.five-sinners
    doc: quest.obc.507019
    title: 五大罪人（坎瑞亚的五位）
    surface: 「五大罪人」是坎瑞亚的五位人物，散见于空月之歌、磷星之章、间章等任务。
    target: 坎瑞亚「五大罪人」的成员、性质，以及与深渊的关系
    confidence: explicit
    basis: >-
      **已确认的三位成员**：
      ① **「黄金」莱茵多特**——「他还是白垩之子——即由五大罪人之一『黄金』莱茵多特
      创造的生命奇迹，人造人」（阿贝多之身世）；
      ② **「猎月人」雷利尔**——「我们现在的对手…是传说中的五大罪人…『猎月人』雷利尔？！」
      并指出「挪德卡莱的狂猎现象则是五大罪人之一的『猎月人』」；
      ③ **苏尔特洛奇**——「我的师父苏尔特洛奇是这方面的专家。坎瑞亚人把他列为五大罪人之一，
      正是因为他们窃取了支撑万象的深渊力量」（丝柯克之师）。
      **性质**：「五大罪人各有欲望。而深渊分化坎瑞亚、诱惑他们堕落的方式，就是放大欲望」，
      即五人因「利用深渊力量」而被列为罪人；「大家对于五大罪人利用深渊力量这件事毫不知情」。
    caveat: >-
      剩余两位成员在本次检索的段落中未出现姓名，需继续追。
      另：用户指出《白之公主与六侏儒》影射「戴因与五罪人」，但该书卷二至卷七正文缺失
      （观测枢与 BWiki 皆只有卷一），**目前无法在语料内验证这一对应**。
      卷一仅留下「夜母/夜之国/月光森林」等意象，与「五大罪人」无直接文字桥梁。
    extra: >-
      值得注意：「猎月人」与挪德卡莱的「狂猎」现象直接相关，
      而《长夜之誓》已记「狂猎」为「自异界而来索命的魔军」——两条可并置。
    status: open

  - id: allusion.descender-numbering
    doc: quest.obc.509101
    title: 降临者的编号体系（第一/三/四）
    surface: 「降临者」在语料中是有编号的群体，散见于须弥、至冬、挪德卡莱的任务对白。
    target: 第一降临者=天理（推测）、第三降临者=神之心材料、第四降临者=旅行者
    confidence: explicit
    basis: >-
      **四个编号各自的信息**：
      ① **第四降临者 = 旅行者**：「旅行者是提瓦特的第四降临者，执行官都知道这一信息」、
      「旅行者，你是提瓦特的『第四降临者』」——且有「执行官都知道」一句，说明这是愚人众内部常识；
      ② **第一降临者 = 天理（推测）**：「据我猜想，『第一降临者』应该就是如今的『天理』」——
      措辞是「据我猜想」，非确证；
      ③ **第三降临者 = 神之心的材料**：「天理用**第三降临者的遗骨**造了七枚神之心，
      用来巩固其建立的七执政体系」；且「神之眼正是七执政体系的产物」；
      ④ **「星之楔」= 第三降临者遗骨的杂质**：「这种力量被认为是神之眼显现时，
      混入了第三降临者遗骨中的杂质所导致。所以称之为『星之楔』」，
      并称其「有潜力能让『槲寄生』真正与『天理』抗衡」。
    caveat: >-
      **第二降临者全库 0 命中**（第二降临者 0 段），这是编号体系里的明确空位，
      比「没有这个人」更可能是「文本尚未揭示」，记为待考。
      另：「第一降临者=天理」原文用「据我猜想」，故不视为定论。
    extra: >-
      本条把三条既有推论串成一条链：天理（第一降临者）→ 造七执政 →
      用第三降临者遗骨铸神之心 → 神之眼作为体系产物连带掺入遗骨杂质（星之楔）。
      即 theory.sky-isle-and-celestia 与 theory.vision-price 之间存在**同一物质/技术传承**，
      而非各自独立的两套设定。这是本次梳理最重要的结构性发现之一。
    status: open

  - id: allusion.dainsleif-betrayal-and-sinners-origin
    doc: quest.obc.507019
    title: 戴因斯雷布的被背叛与「五大罪人」的起源
    surface: 戴因讲述坎瑞亚黑日王朝旧事：兄长维瑟弗尼尔被黑王刺瞎下狱，他去营救，却遭瓜分深渊之力的背叛。
    target: 「五大罪人」的成因，以及戴因与维瑟弗尼尔、猎月人的关系
    confidence: explicit
    basis: >-
      **戴因的亲述**：「那是坎瑞亚黑日王朝时期的事。我的哥哥，预言家维瑟弗尼尔受黑王传召，
      进宫觐见。随后，他被**黑王刺瞎双目投入大牢**。」紧接着：「…然后，**他们背叛了我**。
      就连本该是营救对象的维瑟弗尼尔，也在那个晚上**瓜分了深渊之力**，弃我而去。」
      由此可得：戴因原本是去营救兄长的一方，而「他们」（含维瑟弗尼尔）在那个晚上
      共同瓜分了深渊之力并弃他而去——这与「五大罪人利用深渊力量」被列为罪人的说法吻合，
      即**五大罪人的形成，源头是一次营救行动中的集体背叛**。
      另：维瑟弗尼尔是坎瑞亚宫廷「美名远扬的『预言家』，他有着凡人不可企及的智慧」。
    caveat: >-
      维瑟弗尼尔本人是否列名「五大罪人」，原文未直说（只说他「瓜分了深渊之力」），
      故不擅自将他计入那五人。已知的三名罪人是黄金·莱茵多特、猎月人·雷利尔、苏尔特洛奇。
      另外维瑟弗尼尔对雷利尔「欲言又止」，暗示他与雷利尔之间另有隐情。
    extra: >-
      **与用户的判断相关的结构对照**：用户认为《白之公主与六侏儒》影射「戴因与五罪人」。
      按本条的叙事结构，完全可能对应为「一位被背叛者（戴因）＋ 若干背叛者（六侏儒）」。
      但该书卷二至卷七正文在观测枢与 BWiki 均缺失，**无法逐句验证**；
      且「六侏儒」是六人而「五大罪人」是五人，数目不吻合，需谨慎。
      此点记为**结构性相近但数目不符**，不作结论。
    status: open

  - id: allusion.hyperborea-survivors-and-grudges
    doc: quest.obc.509101
    title: 亥珀波瑞亚的幸存者与「祖先的怨仇」
    surface: 全库 96 段、40 篇提及亥珀波瑞亚，本条收束其遗民谱系与未解仇怨。
    target: 亥珀波瑞亚 → 霜月之子 / 雪孃 / 血王女雅莉亚涅 的遗民谱系
    confidence: strong
    basis: >-
      三条互相咬合的记载：①**霜月之子自认遗胤**——「我们『霜月之子』乃古老的黄金国——
      亥珀波瑞亚的**遗胤**。曾经的繁荣虽已弥散，却也沉淀了独属于我们的记忆」；
      ②**血王女雅莉亚涅是幸存者**——「据称，她是**亥珀波瑞亚的幸存者**，与后世的雪孃们
      在大众心中冷漠、避世的印象不同，她曾极为残暴酷烈地掠夺并夷平了…」，
      说明至冬早期那位「血王女」直接出自黄金国遗民；
      ③**遗民不知祖先仇怨**——「如果那时黄金的亥珀波瑞亚还留有幸存者，那他们一定有很多话要讲，
      只可惜作为他们遗民的霜月之子**并不了解祖先的怨仇**，现在只能空对明月祈祷」。
      另：《影中沉凝的幻灭》称「已然破碎的黄金故土是他未曾谋面的母亲」，
      并提到「亥珀波瑞亚的众生埋藏于至深处的**隐秘**」与「苦苦追寻了几个千年」。
    caveat: >-
      「祖先的怨仇」暗示亥珀波瑞亚的覆灭存在**责任方**（而非单纯天灾），
      但语料未点明怨恨对象是谁（天空岛？天钉？还是内部者），不作推断。
      「埋藏于至深处的隐秘」与《影中沉凝的幻灭》的「大地至深之处」、
      《深廊终曲》的「步入大地至深之处」用语一致，疑指同一处所，待考。
    extra: >-
      本条为 theory.hyperborea-winter 补上「遗民谱系」这一层：
      该推论原本只说「有遗民流散」，现在可具体到霜月之子（宗教群体）、雪孃（种族）、
      血王女雅莉亚涅（政治人物）三支，且三支对同一段历史的记忆完整度不同。
    status: open

  - id: allusion.hyperborea-rebellion
    doc: artifact.obc.508651
    title: 天之美赐（亥珀波瑞亚对「天城」的反叛）
    surface: 圣遗物「天之美赐」，前半写记述者一族的星海兴亡，后半写冻土大城的最后之战。
    target: 亥珀波瑞亚的覆灭不是被动受灾，而是**主动反叛天空岛**的结果
    confidence: strong
    basis: >-
      后半段是一幕完整的叛乱场景：①「流火混杂着血雨点燃了天空…自天而降的星锥卷起了群星，
      连**虚假之日**的光芒都因之黯淡」——天罚降临；②「冻土上的大城里同样灯火通明，
      纹样各殊的猎猎旌旗插满了议事的厅堂」——北境诸部集结；
      ③「**逆光之矢**蓄势待发，将准星瞄向**天城**，就连初生的妖灵也被武装了起来」——
      敌方明确是「天城」，且妖灵（造物）被编入军队；
      ④「叛逆的头领们知晓已到了最后的时刻，与其设法苟延求生不如坦然赴死」——
      **这是主动选择的死战，不是单纯被屠**；
      ⑤「他们不愿相信荣耀的御使胆敢背弃神明，正如他们也不敢承认**天空的谎言**」——
      叛乱的道义理由是对「天空」的诚信失去信任。
    caveat: >-
      本条修正了 theory.hyperborea-winter 的叙述重心：该推论此前建立在
      「神罚说 vs 地脉变动说」的二分上，暗示亥珀波瑞亚是**受罚方**；
      而本篇显示它同时是**举兵反叛的一方**。两种叙述并不矛盾（反叛→招致镇压），
      但「主动反叛」这一层此前完全缺失，须补入。
    extra: >-
      同篇还给出记述者一族的结局：「或许这个所谓超越了时间的种族，到头来也只是坐守星河坟茔的囚徒」
      「沉眠的旅者在终焉追上之前醒来了」——与《深廊终曲》「记述者本不应与原始文明交流」呼应。
      末期对话中点出希望所在：「希望仍在碌碌凡人身上，从他们之中将诞生超越的灵魂」
      「但我们争取的时间太少，还不足以让奇迹在这一代发生」。
    status: open

  - id: allusion.kyrith-wing-tower
    doc: lore.obc.507844
    title: 凯雷丝之翼（通天塔与巨箭）
    surface: 时间囊中的信笺，写信人所在文明正建造通天高塔，并备有「巨箭」。
    target: 凡人文明对「天城之主」的主动僭越——与亥珀波瑞亚反叛并列的第二个样本
    confidence: strong
    basis: >-
      全段为第一人称自述：「我们正在利用最新的**机艺**建造通天的高塔。多高的塔啊，
      好像伸手便能刺破天穹。那曾经被我们的祖辈奉若神明的**天城之主**，我们就要**叩开它的门扉**。
      对此它会作何感想呢？是感慨于我们进步的速度，或是因我们的**冒犯而震怒**？
      不管怎么样都没有关系，因为我们建造的**巨箭**正随时准备保卫我们的文明。」
    caveat: >-
      本条与 allusion.hyperborea-rebellion（「逆光之矢蓄势待发，将准星瞄向天城」）构成
      **同一母题的两次出现**：都以「高塔/巨箭」为手段、以「天城」为目标、都清楚自己在「冒犯」。
      但两者是否为同一次事件，文本未连接——凯雷丝之翼所属文明在语料中未见与亥珀波瑞亚并提，
      故只并置、不合并。
    extra: >-
      这句自述的价值在于它给出了凡人一方的**主观动机**：并非被煽动，而是
      「祖辈奉若神明的天城之主」如今被视作可以「叩门」的对象——**神性的祛魅是主动发生的**。
      这与《天之美赐》「不敢承认天空的谎言」互为表里：一边是不信，一边是要去验证。
    status: open

  - id: allusion.aeyra-confession
    doc: lore.obc.506460
    title: 爱依菈的笔记（谎言、罪与对新月的安排）
    surface: 第一位咏月使爱依菈的私人笔记，藏于「遗誓者的圣所」，从未示人。
    target: 爱依菈的真实心态、霜月之子的礼制改革动机、以及「新月」的诞生计划
    confidence: explicit
    basis: >-
      八处关键自述：①**她说了谎**——「和娄维娅一样，和姐姐一样，我也说了谎。索洛维先生问我
      是否心怀恨意的时候，我的回答是否定的」，但她承认「我要如何用言语向他述说心中的恨呢」；
      ②**自认染罪**——「从盐的贵女到居尔城妖灵的后嗣，无罪而受尽极刑者俯拾皆是，
      遑论像我这样沾满…的染罪之人」，并说「染罪之人不应得见无垢的月光」；
      ③**拆塔主张**——「除龙裔于此修建的巨柱外，也就是被我们的先祖视作避难之地的圣所外，
      所有的城垣、高塔、要塞与圣殿皆应拆除…自霜月中来的，理应归还于霜月」，
      理由是「长久的隔绝与闭塞只会纵容一时的野心与妄念」；
      ④**新月的计划**——「数十年后，新的月神便会诞生」，而「娄维娅所苦苦寻求的一切」
      到头来「徒劳无功」；并提到「即便…如期诞下圣嗣，**而非诞下那个拐走姐姐的男人**
      ——那个**本应成为我们的王的人**，也不过是在至冬掀起更大的混乱罢了」；
      ⑤**对信仰的规训**——「应当让人们相信，新月只会为良善、友爱与互助的行动而欢欣」，
      「人们必须如此相信，否则无论是多么高尚的理想，都只会在月下的污秽中褪尽原本的色泽」；
      ⑥**让新月保有自主**——「必须确保那选择的权柄只掌握在她自己手中…不应向她索求任何回馈，
      她不应该成为任何人心愿中完美的神明」；⑦「愿霜月永不饶恕我的罪，因为我曾无数次诅咒过她的名」。
    caveat: >-
      「拐走姐姐的男人」与《纺月的夜歌》「那本应诞下圣嗣的少女在**无月的雪夜与北国的少年相逢**」
      应指同一事件：姐姐（或圣嗣之母）被一位「本应成为我们的王」的男人带走。
      但两处均未点该男子姓名，故只能确认事件、不能确认身份。
      「盐的贵女」「居尔城妖灵的后嗣」是两个新出现的受刑者例子，暗示霜月之子境内曾有系统性极刑。
    extra: >-
      这条把爱依菈从「被姐姐背叛的悲剧人物」改写成**主动的操盘者**：她撒谎、自认染罪、
      拆除高塔、安排新月诞生、并试图限定新神只能行善、不得被索取。
      《终北祷歌集》里「依循最初的咏月使爱依菈的谕令，祭礼已在五百年前被废止」——
      那些废止令的动机，在此有了私人理由：她认为繁复祭礼是在纵容妄念。
    status: open

  - id: allusion.louvia-death-and-hodvang
    doc: lore.obc.506456
    title: 给爱依菈的信（娄维娅之死、爱莉厄献身、霍德望）
    surface: 挪德卡莱一方写给爱依菈的信，及写给已故娄维娅的信，谈战事、圣物与哀悼。
    target: 霜月之子后期的三件事——娄维娅之死、爱莉厄的献身、对「霍德望」的战争
    confidence: strong
    basis: >-
      **娄维娅之死**：给爱依菈的信末句「我很清楚，**娄维娅死后**，现在的霜月之子，
      还有数不清的事务需要您处理」——确认娄维娅已亡，且死后事务由爱依菈承担。
      **爱莉厄的献身**：「爱莉厄小姐的事，我很遗憾…正是因为她高尚的献身，
      我们才得以**击败霍德望**，无数生灵才得以免遭涂炭」，并说「她为何要假借我挚友的身份行事」；
      她的遗愿是「希望您能幸福、自由」。
      **两件圣物**：①「**德肋庇革劳诺之箭**」，据说能「高效清理**漆黑的灾厄**」；
      ②「**三宝磨**」，连收信人「也完全无法理解这圣物的运行原理」，需另寻方式启动。
      **第三方势力**：给娄维娅的信提到「即便是在**白沙皇**陛下的宫廷里」，说明挪德卡莱与白沙皇
      宫廷有往来；同信还记一位「圣女」被迎回时「出于一时的冲动，竟当场寻了短见」。
    caveat: >-
      两封信的收信人不同（爱依菈 / 娄维娅），但都出自挪德卡莱一方，说明霜月之子与挪德卡莱
      在某一时期是同盟或从属关系。「霍德望」的来历与「漆黑灾厄」的具体所指，
      语料在此未展开，需另找。
    extra: >-
      「白沙皇」与《炉火融炼之心》「冰雪之国苍白的皇帝」应为同一人或同一系（皇室称谓）。
      若成立，则霜月之子—挪德卡莱—至冬白皇之间存在一条外交/同盟线，可与
      theory.hyperborea-winter 的遗民谱系合并观察。
    status: open

  - id: allusion.heir-project-and-three-treasures
    doc: lore.obc.506458
    title: 古老的书册（「圣嗣」项目与亥珀波瑞亚机艺体系）
    surface: 霜月之子保存的亥珀波瑞亚时期技术档案与训敕，由覆灭后第十三任主祭莎乐妮允准。
    target: 「圣嗣」项目的目标与失败原因、三宝磨的真相、以及亥珀波瑞亚的净化技术
    confidence: explicit
    basis: >-
      **「圣嗣」项目**：档案明确写「圣嗣项目已不具备按照原定规划继续推进的可能性」，
      原因是「主持该项目的祭司（**依但禄撒氏族的翁答**）已死亡，相关构艺工序与机艺设备
      也已在**亥珀波瑞亚覆灭时遗失**」。而其目标极为清楚：新诞生的「圣嗣」
      「**无需借助任何祭礼用具，无需以自身的灵魂为代价**，便可自由操纵
      **未经篡改的纯净元素力**，完成与『世界』的融合」——并且「预计该方案将在（…）
      世代的迭代后，达成与原定目标接近的结果」。
      **三宝磨**：「所有亥珀波瑞亚时期的至高阶机艺设备中，仅有**亚原子质能衍构核心**
      （以下简称为「三宝磨」）遗存至今，且结构相对完好…然而…该设备当前已不具备
      重新运作的可能性」。
      **净化技术**：「本项目为亥珀波瑞亚时期的**低阶机艺设备**，用于将（…）界能量
      固化为半晶态聚合物，并由高频（…）进行回旋加速后抛射，从而**清除目标区域内的
      （…）界能量污染**」——与《给爱依菈的信》提到的「德肋庇革劳诺之箭」功能吻合。
    caveat: >-
      两处关键对照：①「无需以**自身的灵魂为代价**」这句，反证了现行体系（神之眼）
      是**要付灵魂代价**的——与 theory.vision-price「把自身出卖给命运」形成直接呼应；
      ②「**未经篡改的**纯净元素力」中的「篡改」，疑指天理把燃素改造成元素力一事
      （见《白夜国馆藏》），即亥珀波瑞亚想恢复改造前的力量形态。此二点皆为关联推测，
      文本未明言对应关系，故不写进 claim。
    extra: >-
      时间锚点：本救令由「亥珀波瑞亚覆灭后的**第十三任主祭**」莎乐妮允准，
      可作为霜月之子礼制延续世代数的下限参考。
      另有悲观独白：「终北的灯火已经熄灭，无数世代注定瑟缩于阴恶的夜。
      月下污浊的世界从未有过奇迹，泪水从未拯救过我们的同胞」。
    status: open

  - id: allusion.shadow-world-and-elf-truth
    doc: lore.obc.509607
    title: 某位高贵之人的笔记（影中世界=亥珀波瑞亚故墟；妖精并非奴仆）
    surface: 白冕宫中发现的高贵者笔记，记其穿越「影中世界」所见与所悟。
    target: ①影中世界即亥珀波瑞亚故墟；②天钉（审判）是毁灭的直接手段；③妖精身份不是「仆从」
    confidence: explicit
    basis: >-
      **四组关键内容**：
      ①**影中世界即故土**——「这里无疑就是我曾无数次在深沉的幻梦中到访的『影中世界』，
      是我所苦苦寻觅的未曾谋面的故土——**亥珀波瑞亚的故墟**」；
      ②**毁灭手段是天钉**——「亥珀波瑞亚的真实历史似乎与流传于南方角人部族中的传说并没有
      太大的差异。**僭越者的城邦被判罚的天钉所消灭**，这样的故事在大陆上屡见不鲜。
      哪怕加上所谓『天使』一族的助力，结局亦未曾改变」；
      ③**妖精身份的反驳**——「我等妖精的族裔，**并非如传说中所言是作为黄金国人类的仆从而
      诞生的**。那些将我们称作奴仆的词句，不过是恐惧于我们存在之人编造的谎言。相反…我见到了
      我们曾被寄予的、更为高贵与远大的期望」；
      ④**命运锁定**——「■■是对的，亥珀波瑞亚的命运**早在圣徒到来之前便已注定**。
      毁灭的判决已经写下，天使的长女亦无从更改。忠实于未来的人们，他们的全部努力到头来
      只是让那场审判**推迟了三十年**到来」。
      另有：**圣徒的目的**是「寻找世界最初被创造时的光…创世之初遗留下来的碎片，
      蕴藏着足以点亮星辰的潜力」；且「那贯穿影域的通道，以及至今仍在向凡世渗漏的污秽，
      皆是我不可推卸的罪业」——通道由这位笔记主人打开。
    caveat: >-
      **本条修订两处此前的判断**：
      （一）《影中沉凝的幻灭》里雪孃王公自称「刻写于我等昔日**为奴**的血脉」，
      我曾据此推「雪精一族曾为仆从」；本笔记明确否认，称那是「恐惧于我们存在之人编造的谎言」。
      两说对立，**不可合并**——现记为「仆从说（雪孃自述）」vs「非仆从说（本笔记）」并存，
      与亥珀波瑞亚的「神罚说 vs 地脉变动说」同属一类矛盾。
      （二）「亥珀波瑞亚被天钉消灭」与「地脉变动导致晶灾」（遗民手记）并不冲突，
      但本条给出更完整的表述：**审判（天钉）是判决的执行，晶灾可能是其后果**。
    extra: >-
      「推迟三十年」这个数字与《绝云记闻·山灵》「仅三十日后，灾祸遽起」的「三十」同数，
      是否有关联纯属猜测，不作断言。
    status: open

  - id: allusion.hyperborea-chimera-and-treants
    doc: lore.obc.509608
    title: 炼金术士的手记（源生嵌合体与树妖的创造）
    surface: 白冕宫「谧源所」的炼金术士手记，记嵌合体实验的技术细节与阿克西妮娅的赌约。
    target: 亥珀波瑞亚的造物技术——「地原胚质」研究与树妖等种族的由来
    confidence: strong
    basis: >-
      **技术链条**：①「令两种或以上生物的特性在同一个体上得以保留的核心课题，
      其实是如何在一具躯体内保有不同的循环系统」；②「使不同性质的生物胚通过
      『**源生嵌合体**』形成属于该生物胚的内循环体系」，再让「不同的『部件』
      …在生长中进行结合，以此形成**嵌合兽**」；③后期改良为「直接在**吞吃生物胚**后
      进行完全的吸收，直接将生物特性重组，即便如此，内循环体系数目仍然为一」；
      ④**造物的结果**：「这应该也是**亥珀波瑞亚在「地原胚质」研究的后期才制造出树妖
      这一种族的缘由**」——即树妖是人造种族。
      另：「阿克西妮娅说根据计算上限应该在**五个**…如果她能造出支持五种生物胚的
      『源生嵌合体』，我就偷偷带她去『老庭院餐厅』喝酒」——技术上限为五种生物胚。
    caveat: >-
      本条与 allusion.angel-betrayal-and-voidmoon-envy 中「最禁忌的创造之事」直接呼应：
      天使交给凡人的正是造物之权，而这里能看到它的**工程化落地**（拆分成
      「循环系统保有 → 源生嵌合体 → 部件结合」等步骤）。
      「树妖」是否即游戏内的「丘丘人/史莱姆」等已知种族，文本未明，不作对应。
    extra: >-
      手记末尾一句转为伦理批评：「什么叫**共有之爱**，这就是她所期望的**所有人爱所有人**的
      世界吗…可是，**爱不该是这样的东西**」——说话人不同意「共有之爱」的理想，
      这是继「仆从说 vs 非仆从说」之后，亥珀波瑞亚内部**价值观分歧的又一例证**。
    status: open

  - id: allusion.miyuan-office-factions
    doc: lore.obc.509610
    title: 矮灵王公的手记（「谧源所」的掌控者与三方人物）
    surface: 矮灵王公手记，记陛下崩逝后他掌控谧源所，并图谋「新的基捷城」与某种力量。
    target: 亥珀波瑞亚/至冬过渡期的权力结构——炼金术士、雪孃、阿克西妮娅三方
    confidence: strong
    basis: >-
      **三方人物画像**（写于陛下崩逝之后）：「只懂得**将生命如烂泥揉捏的炼金术士**，
      **对自己的种族不满的雪孃姑娘**，还有…**阿克西妮娅**，陛下过度保护的『**宫廷小丑**』」。
      **核心动机**：「至冬需要**新的基捷城**，那会是我的功绩，一旦取得，即使是
      **新王座上的那一位**也不得不承认」；「在那之前，我该…我应该拿到**我的那一份**，
      这也是『**他**』应允我的，我该取得这个的力量」。
    caveat: >-
      三处待考：①「他」是谁——应允给王公力量者，语料在此处未点名；
      ②「我的那一份」指什么力量（疑与深渊/谧源所所藏相关，未明）；
      ③「陛下崩逝」的「陛下」是白沙皇一系，与《炉火融炼之心》「苍白的皇帝被漆黑的浊流
      吞噬」是否同一人，需另证。
    extra: >-
      本条给出亥珀波瑞亚遗民团体的**内部张力**：炼金术士（技术派）、雪孃（种族自卑者）、
      阿克西妮娅（宫廷小丑/被保护者）、矮灵王公（政治野心家）四方各有诉求。
      阿克西妮娅同时出现在《影中沉凝的幻灭》（「华发如银的少女」→「影中的法师」），
      两处可互证为同一人物。
    status: open

  - id: allusion.frostmoon-rites-as-identity
    doc: weapon.obc.506390
    title: 纺夜天镜（礼制的双重性：失乡者徽章 vs 隔绝高墙）
    surface: 武器「纺夜天镜」，霜月之子至高的圣物，传说见证了月之少女的诞生。
    target: 霜月之子坚守千载祭礼的真实动机，以及「为圣嗣可容赦一切」的伦理豁免
    confidence: strong
    basis: >-
      **礼制的双重性**：一方面「唯有那传承的祷歌，唯有那千年前的祭礼，才能成为
      **维系失乡者的徽章**」——礼制是流散遗民的**身份认同装置**；
      另一方面「那些实际从未被异邦人所知的典仪，**筑起了隔绝外世的高墙**」——
      同一套礼制也是自我封闭的机制。
      **自我质疑**：文本直接反问「何人会敬奉已死的神祇？何人会忍受无望的苦境，
      只为那空幻缥缈的臆想？」，并承认「蒙昧的人们总是渴求切实的导扬」。
      **伦理豁免**：结尾给出最重的一句——「直到无数世代淬炼的纯净血脉最终诞下
      那足以让尘世屈膝的**圣嗣**，直到那时，**无论是谎言还是罪愆，都理应得到容赦与颂赞**，
      因其皆是为月下无垢的乐园——」。
    caveat: >-
      最后这句是理解爱依菈行为的关键：她在笔记里承认自己「说了谎」「是染罪之人」，
      却仍继续推进新月计划——正因为霜月之子的伦理体系中，
      **「为乐园而犯的罪可以被容赦」**。两条记录互为解释，但文本未直接关联，
      属并置推断。
    extra: >-
      「由无瑕的白银铸就的明镜，传说见证了**月之少女**的诞生」——
      「月之少女」与「命定之嗣/圣嗣」是否为同一存在，未明。
      「命运的纺轮锈蚀，银线亦随之黯淡」与《爱依菈的笔记》「银白的纺线已经缠住了我的脖颈」
      同为「纺线＝命运」的意象，可并置。
    status: open

  - id: allusion.elys-and-golden-city-legion
    doc: weapon.obc.7509
    title: 静水流涌之辉（伊黎耶、纯水骑士与「黄金之城军团」）
    surface: 武器故事，记纯水骑士伊黎耶的出身与誓愿：故乡被黄金之城的军团焚灭。
    target: ①「黄金之城」曾派军团屠戮诸国；②纯水骑士的「原罪」与使命；③伊黎耶的身世
    confidence: strong
    basis: >-
      **核心一句**：「传说她的故乡早已在**神王的烈怒**中被焚灭，**自黄金之城而来的军团**，
      将她的亲族悉数奴役与屠戮，唯有两人侥幸逃脱」——这是首次把「黄金之城」
      明确写成**对外侵略的一方**，而非只是被毁灭的受害者。
      **誓言内容**：「我等以**厄歌莉娅**之名起誓，誓要寻回那**纯水之杯**，迎她回到她的国度」
      「唯有藉此一途，方能偿赎我等**与生俱来的原罪**」——纯水骑士的使命是**赎回原罪**，
      而非单纯复仇。
      **两条分野**：逃脱的两人走向相反——「一人在战火中与高傲的**调律师**相遇，
      最终被擢升为威权的**继业者**；另一人则蒙受众水之主的垂怜，为埃雷莫利卡岛的王爵所
      收养抚育，护望尚未被神王夺去的纯水」。
      **旧世结局**：「深罪诱致了**永恒之都**的沉沦，使无数奴隶与僭主沦殁于黑夜的怒潮中」。
    caveat: >-
      「黄金之城」在此是**加害方**，与《天之美赐》《某位高贵之人的笔记》中
      「亥珀波瑞亚是受罚方」的叙述构成张力。可能的调和是：亥珀波瑞亚在覆灭**之前**
      是区域霸权（对周边劫掠），覆灭**之时**成为受罚者——即它同时是加害者与受害者。
      但两处文本未直接连接，「黄金之城＝亥珀波瑞亚」仍属推断（沿用此前的谨慎处理）。
    extra: >-
      「伊黎耶」此前仅见于 BWiki 整理（「伊黎耶与厄歌莉娅诀别」），本次在语料中确认其为
      纯水骑士之名。「调律师」也再次出现（前见《昔时之歌》），两书互证该阶层的存在。
    status: open

  - id: allusion.bloodmaiden-and-beastlord
    doc: weapon.obc.509878
    title: 凝雪沉心（血孃、兽主与「爱是恐惧」）
    surface: 武器故事，苍耀的侍女在恩主死后向兽王复仇，与兽主有一场关于「爱」的问答。
    target: 至冬「血孃/血王女」一系的动机，及其与兽怪联盟的关系
    confidence: strong
    basis: >-
      **复仇动机**：「看看那些凶兽吧，看看他们把我母亲的梦变成了什么样」
      「**黄金的大城倾倒了**、倾倒了，成了污秽可憎之物的坟场」
      「既然只有我能庇护恩主的后嗣——那就**让血债用血来偿**」。
      **与兽主的对话**：「盘踞深林的**兽王**亲自前来提议停战，乞求残暴的**血孃**
      莫再屠戮同族妖灵」，而血孃「竟向自己提问**什么是爱**」；
      切纳雷卡的兽主回答：「**爱是恐惧**。凡有血气的都会恐惧，恐惧迷恋之物，
      会在有朝一日失去。」
      **恩主的恩惠**：「**拂晓的主母**亲手为她摘去诅咒，使她的同胞不必屈从于命运」，
      并说「纵然是卑微如雪尘的她，也能在那个**黄金般的梦**中寻得幸福」。
    caveat: >-
      「血孃」与《至冬国通史》「血王女雅莉亚涅·莫蕾芙娜」应为同一系（同用「血」+ 女性称谓 +
      与兽怪联盟敌对），但文本用词不同（血孃/血王女），未直接等同。
      「拂晓的主母」与《西风教会》「拂晓的枢机」用词巧合，是否相关纯属猜测，不作关联。
    extra: >-
      这场问答是本条最有价值之处：兽主以「爱是恐惧」作答，把爱定义为
      **对失去的恐惧**——而血孃此前被描述为「既然我庇护恩主的后嗣」，
      两者的区别在于「恐惧驱动的占有」与「不求回报的庇护」。
      这句话可与《爱依菈的笔记》「爱不该是这样的东西」并置，
      构成「何谓爱」这一母题的两处变奏。
    status: open

  - id: allusion.louvia-orphan-chieftain
    doc: weapon.obc.506912
    title: 圣祭者的辉杖（娄维娅的身世与「命运纺线」）
    surface: 武器故事，前任主祭将权杖交给年轻的娄维娅，并述说霜月之子的命运观。
    target: 娄维娅的真实出身，以及霜月之子「万事皆随纺线」的决定论
    confidence: strong
    basis: >-
      **娄维娅的身世**：交接时称「接过这主祭者的权杖吧，我的**娄维娅**，我善良的孩子，
      我最纯净的孩子呀」，而本段末尾揭出——「那是原本**不应获选的未曾蒙福之人**，
      **从未知晓过自身被收养之事的外邦遗孤**」。即娄维娅并非霜月之子血裔，
      而是被收养的外邦孤儿，且本人不知情。
      **决定论表述**：「**霜月的女主人早已用银线纺出了世间一切道路，万物不过是随着纺线
      起舞**」——把人世一切归为已纺就的线。
      **权柄性质**：此杖「曾被**亥珀波瑞亚的主祭们**用作指引霜月之子前行的权杖」，
      交接词强调「唯有你的**仁心与慈爱**能够唤回那些迷途的羔羊」「因弱者生来便会渴慕归宿」。
    caveat: >-
      「外邦遗孤」与《给爱依菈的信》「娄维娅死后」相合：她既是外邦人，又被推上主祭之位，
      且已身故。她的死不必然等于牺牲，语料未写死因。
      「万物随纺线起舞」与《爱依菈的笔记》「银白的纺线已经缠住了我的脖颈」同用「纺线＝命运」，
      但爱依菈的态度是**抗拒**（她自认染罪、仍要操盘），而此处是**顺从**——两人对同一教义
      的立场相反，可并置观察。
    status: open

  - id: allusion.ajax-hyperborea-link
    doc: weapon.obc.506390
    title: 峡湾长歌（阿贾克斯、亥珀波瑞亚与「换生灵」）
    surface: 武器故事，记至冬冻土的来历与少年阿贾克斯的传奇。
    target: ①至冬与大陆「切断脐带」；②阿贾克斯与亥珀波瑞亚的直接关联；③「换生灵」的存在
    confidence: strong
    basis: >-
      **亥珀波瑞亚即至冬前身**：「传说**冬季来自亥珀波瑞亚**，那边峡湾与极光如同狼牙一般
      曲折而锋利」——直接以「冬季来自亥珀波瑞亚」定义今之至冬。
      **地理断连**：「直到最后这片冻土如同有梦想或意志一般，**将自己与大陆的脐带切断**」。
      **阿贾克斯**：「在冰海深处发现了**黄金与白石之国**的少年**阿贾克斯**的传奇」，
      并记他「乘船闯入巨鲸的腹中」「在雪原上与龙对峙七日」「曾与**雪孃相爱**，
      却因**换生灵**的恶戏而失去了恋人」，「坠入了从未被发现的王国」。
    caveat: >-
      「阿贾克斯」即「公子」达达利亚的本名（另见梦见月瑞希相关材料），
      但本条所述是其**传奇化版本**（巨鲸、龙、雪孃），未必与游戏内经历一一对应；
      应视为「至冬民间关于阿贾克斯的传说」，而非直接传记。
      「换生灵」是首次出现的概念，与「雪孃」并列，暗示至冬存在会「替换/骗走」人形的存在。
    extra: >-
      「黄金与白石之国」是继「黄金之城」之后对亥珀波瑞亚的又一称谓（加了「白石」），
      可与《昔时之歌》「白银的不凋花」「苍水晶」等白石意象并置。
    status: open

  - id: allusion.aeyra-designated-mother
    doc: weapon.obc.509877
    title: 织月者的曙色（爱依菈被指定为「圣嗣之母」）
    surface: 传说由最初的咏月使祝福过的银剑，附有主祭对年幼爱依菈的训诫。
    target: 爱依菈本人就是「圣嗣之母」的指定人选，以及她被禁止与外邦人通婚的缘由
    confidence: explicit
    basis: >-
      **决定性的一段**：主祭对爱依菈说——「我的**爱依菈**，我亲爱的孩子，我最眷宠的孩子呀」
      「我们血中所流的乃是至洁的银辉，惟独我们得以领受霜月之主所赐的恩典」
      「**你不可与外邦人的儿子结亲，因为你注定要为终北的众民诞下乐园的新主**」。
      这三句把「圣嗣」计划与她本人直接绑定：她不是操盘者，**她本人就是被指定的母体**。
      另一句紧承接：「霜月的女主人早已用银线纺出了世间一切道路，万物不过是随着纺线起舞」——
      用决定论为这条禁令背书。
      末段评价：「那是**漆黑的灾厄尚未席卷边地**的时日，**终北的主祭徒劳地重复着亵渎的愚行**」。
    caveat: >-
      **本条与《纺月的夜歌》「那本应诞下圣嗣的少女在无月的雪夜与北国的少年相逢」直接呼应**：
      爱依菈正是那位「本应诞下圣嗣的少女」，而「北国的少年」极可能就是她被禁止接触的
      「外邦人的儿子」。若此说成立，她的「罪」就不是抽象的，而是**违反了圣嗣之母的身份约束**。
      但《爱依菈的笔记》与《纺月的夜歌》都未被明确指为同一人，此处属三条互证后的推断，
      故定 explicit 于「她被指定为母体」这一事实，而「她与北国少年相恋」仍属推定。
      「终北的主祭徒劳地重复着亵渎的愚行」一句，暗示主祭一方**才是**亵渎者（而非爱依菈）。
    extra: >-
      本条的叙事立场值得注意：训诫者自认在传「至洁的银辉」，
      而叙述者却评价这是「亵渎的愚行」——**同一行为的两种相反定性**，
      与「仆从说 vs 非仆从说」同属亥珀波瑞亚文本的典型矛盾结构。
    status: open

  - id: allusion.fortuna-and-ancient-orders
    doc: lore.obc.503139
    title: 鲁杰罗的笔记（「法图纳」大乐章与古代教团）
    surface: 枫丹学者鲁杰罗的考察笔记，研究古代教团遗迹、海螺与大乐章。
    target: 枫丹前文明时代的统治机制（以乐章为媒介）与古代教团的一次「彻底分裂」
    confidence: strong
    basis: >-
      **核心概念「法图纳」**：「『**法图纳**』…似乎是**乐章的名字**…古代的文献记载了这种
      **连接着根源力量的大乐章**的存在…**前文明时代的神明似乎便是依赖着乐章的力量统治枫丹的**…
      古代的雷穆利亚人用音乐记录一切，就连魔法也不例外」。
      **教团的同源与断裂**：「对各地存在的古代教团遗迹进行了比较研究…虽然被冠以种种不同的名字，
      但从他们留下的秘文和图式来看，可以断定**存在着共同的源头**」；但「不同时期留下的
      魔法术式之间存在着**明显的断裂**」，作者假设「在某个未知的时间，这些古代教团曾发生过
      一次**彻底的分裂**」。
      **地名考**：「**佩特莉可**…在古代的语言中似乎与『**魔像**』同义」。
    caveat: >-
      「法图纳」音近拉丁语 fortuna（命运），且「依赖乐章统治」与「音乐／纺线／命运」的
      意象群（参见《爱依菈的笔记》「银白的纺线」、《纺夜天镜》「命运的纺轮」）属同类隐喻，
      但语料未将其与「黑玛门尼」或纺线体系直接连接，故只并置、不合并。
      作者鲁杰罗是「智者委员会的创立者」，其成就「至今也没有得到公正的评价」——
      这条对应关系（教团分裂发生于何时）仍属待考。
    status: open

  - id: allusion.abandoned-shelter-gracezna
    doc: lore.obc.507701
    title: 废弃避难所（格蕾兹娜、莫洛佐夫的骗局与净化植物）
    surface: 「废弃避难所」的终端日志与通讯记录，研究员格蕾兹娜记录实验、骗局与赎罪。
    target: 挪德卡莱避难所事件的真相——莫洛佐夫伪造「世界已毁」、滥用深渊污染、净化植物
    confidence: strong
    basis: >-
      **骗局核心**：「最初增设管道的时候，我就应该想到，那东西也同样可以用来承载**深渊污染**，
      好让**莫洛佐夫**营造出**外面的世界早已在深渊中彻底毁灭的假象**」——
      即避难所内的居民被欺骗，以为外界已不存在。
      **霍德望再现**：「我不知道**霍德望**是谁，我不知道他们究竟有什么可悲的计划…
      我只知道他们的血也同样染在了我手上，只因为我听信了他们的谎言」；
      又说「莫洛佐夫也和那个**霍德望**一样，尽管丧失了全部的神智与心性，有朝一日也会作为
      **无理智的怪物复活**」——深渊污染的最终形态是「无理智的怪物复活」。
      **净化植物**：「经过先前数月的受控实验，我们已确认**实验植物**在处理高浓度深渊污染及
      （…）废弃物方面表现出极高的效能…样本在短时间内便成功遮蔽了所有来自避难所外的
      深渊灾厄污染」，但作者也警告「深渊魔兽出逃造成的人员伤亡事件…不在我们可以进行
      主观调控的范围内」，并导致「**帕伊娃**的病逝」。
      **与霜月之子的隔阂**：「直至被**霜月之子咏月使**（这是什么？那些怪人不是只有主…」——
      格蕾兹娜对霜月之子几乎一无所知。
    caveat: >-
      「布莱赫·雷德·米勒」在此作为第三方出现（「说这里的深渊污染无法一朝一夕被清除」），
      并带走净化植物样品——此人与《大盗雷德·米勒传奇》应为同一人物，
      说明该传说的主人公在语料中仍有活生生的活动记录。
      霍德望在《给爱依菈的信》里是「被爱莉厄献身击败」的对象，此处又称「不知道他是谁」，
      两次出现的时间关系不明，需另考。
    extra: >-
      格蕾兹娜自述「我没办法再去见那些幸存的孩子们。要是莉莉再问我，帕伊娃的病什么时候
      才能康复，我又该回答什么呢？」——她的罪感与《爱依菈的笔记》「唯愿所有的罪孽皆集于我身」
      是同一种自我归罪结构，可并置观察。
    status: open

  - id: allusion.leyline-heat-drain-winter
    doc: lore.obc.510350
    title: 调查者的手札【至冬】（至冬变冷的物理机制）
    surface: 至冬的调查者手札，记录亥珀波瑞亚覆灭后的地脉异变与「他」的权能。
    target: "至冬为何变为冻土——地脉失控吸走全部热量并转化为厄生晶矿"
    confidence: explicit
    basis: >-
      **决定性一句**：「**地脉**因为（…）的缘故，**失控的（…）吸收了所有的热量，
      变化成了漆黑的厄生晶矿，北国之陆因此变为一片冻土**。」
      这是全库唯一一条把「亥珀波瑞亚覆灭 → 至冬变冷」的**物理链条**讲完整的文本：
      地脉失控 → 吸热 → 生成厄生晶矿 → 冻土化。
      **「他」的权能**：「『他』有令**暴动的权能**停止下来的方法…但这种力量并非无法复现…
      这些**发着荧光的灯晶**就证明了这一点」；「亥珀波瑞亚的遗民，对于『他』的权柄的研究，
      拥有了这个，再利用我手上的**卵中之人的力量**」。
      **时代锚点**：「众人皆知晓**亥珀波瑞亚覆灭之后**…」（即异变发生在覆灭后），
      并提及「**伊兹梅洛**那个家伙的举措也有所耳闻」。
    caveat: >-
      **本条是对 theory.hyperborea-winter 的关键补强**：该推论此前只能并列「神罚说」
      与「地脉变动说」，并把后者当作遗民的主观解释；现在有了机制层面的直接陈述
      （热量被吸走 → 厄生晶矿 → 冻土），「地脉变动说」的可信度显著上升，
      且与「天钉审判」并不矛盾（天钉落下 → 地脉失控 → 吸热成晶 → 永冬）。
      「他」是谁仍未点名（疑为白皇或某位握有权能者），「卵中之人」为首次出现的概念，
      均需另考。
    extra: >-
      「暴动的权能」与「令其停止的方法」——暗示某种可开关的力量，
      与《古老的书册》「亚原子质能衍构核心（三宝磨）」是否同一技术水平，属待考。
    status: open

  - id: allusion.blahe-treasure-hoard
    doc: lore.obc.507823
    title: 布莱赫的笔记（盗宝鼬、霍德望与「善意的清水」）
    surface: 布莱赫（即大盗雷德·米勒）在藏宝库中的笔记，回忆童年与父辈旧事。
    target: ①盗宝团名号的由来；②布莱赫之父被霍德望利用；③一句流传的处世隐喻
    confidence: strong
    basis: >-
      **盗宝团由来**：为纪念鼬鼠帮忙运铁钱，「就管这些小家伙叫『**盗宝鼬**』、
      授予它们『**盗宝团正式成员**』的头衔好啦！」——随后又说「一定不能叫这个名字」，
      属半开玩笑。但这是「盗宝团」名称首次出现于私人文书的记录。
      **父辈与霍德望**：「父亲…**哪怕被霍德望利用到那种地步**，也从未对他有过…」——
      布莱赫的父亲是霍德望的受害者。
      **两桩旧事**：「**艾维雷勒安和西尔维斯特**那两个老家伙跑来套我的话…我那时才五岁」，
      二人「假扮劫富济贫的侠盗」窃走私房钱，而父亲「不出三天，就从其他地方加倍搜刮回来了」。
      **核心隐喻**：「就像**爱莉厄小姐那位阴沉得吓人的妹妹**对我说过的那样，
      无论是何等**善意的清水，落在恶意的土壤上，浇灌出的也只会是恶的穗种**」；
      又评「**劫富济贫的游戏只会让贫者的枷锁更沉重**」。
    caveat: >-
      「爱莉厄小姐」与《给爱依菈的信》中「正是因为她高尚的献身，我们才得以击败霍德望」的
      爱莉厄应为同一人；此处还点出她有一位「阴沉得吓人的妹妹」——该妹妹身份未明，可作待考。
      「女皇在上」说明布莱赫所处时代已在至冬女皇治下，与「挪德卡莱最黑暗的年代」有重叠。
    extra: >-
      本条最有价值的是那句隐喻：「善意落在恶意土壤上长出恶穗」——
      它与《爱依菈的笔记》「多么高尚的理想，都只会在月下的污秽中褪尽原本的色泽」
      几乎同义，可并置为**两种不同立场者对同一困境的相同判断**。
    status: open

  - id: allusion.golden-opera-cassiodor
    doc: artifact.obc.500036
    title: 黄金剧团（卡皮托利姆、神王与卡西奥多）
    surface: 圣遗物「黄金剧团」，讲乐师与勇士卡西奥多从友谊到决裂，以及黄金秩序的自我崩解。
    target: 枫丹「黄金帝都卡皮托利姆」与神王政权的性质，及其崩解的起点
    confidence: strong
    basis: >-
      **政权形态**：「命运之曲曾沿各处水道奏响，传播着文明与秩序的谐和旋律」，
      都城为「**黄金帝都最高之城卡皮托利姆**」，统治者是「**神王**」；
      其意识形态为「只有在**威权的管束**下，秩序才得以诞生」，口号是
      「骄傲正如**黄金之花**在荣耀王国公民的胸前盛放，神王的远见之下将再无贫弱蛮荒」。
      **人物**：年轻乐师与一名「奴仆」结友，「那奴仆的名字如今已无人知晓，
      但日后『**卡西奥多**』之名将广布天下」；二人同赴卡皮托利姆完成试炼。
      **崩解原因**（文本自己给的诊断）：「随着水道的扩展，**威权不仅带来进步与秩序，
      也带来了傲慢、暴力与剥削**」；卡西奥多劝诫「并非所有人情愿被剥夺家乡与自然，
      并非所有人都能接受我们的曲调」「你曾称他们为『**旧日之人**』…但忠于旧日的人，
      也有不容忽视的执着」，对方则答「既然蛮荒与蒙昧依然隐藏在枫丹的任何土地…我们便**灭绝它们**」。
      **结果**：「就在这一刻，黄金的时代骤然停滞，从而陷入了**无穷无尽的战争与叛乱**」。
    caveat: >-
      「黄金帝都卡皮托利姆」与「黄金之城亥珀波瑞亚」是否同一政体，语料未直接连接。
      两者都自称黄金、都有神王、都因僭越而崩——但地域不同（枫丹 vs 至冬），
      按现有证据应视为**两个不同的"黄金秩序"**，不可贸然合并。
      「成为钢铁般的纯粹之人」一句疑指改造（与亥珀波瑞亚的造物技术在概念上相通），
      但文本未说明手段。
    extra: >-
      本条与《昔时之歌》（纯水骑士反抗黄金僭主）、《香韵奏者》（大调律师优恩尼娅）
      属同一时代的不同视角：统治者的自述、被统治者的反抗、以及中间阶层的犹疑。
      三者并置，可构成枫丹古代史的完整三角。
    status: open

  - id: allusion.glorious-king-and-sibyl
    doc: artifact.obc.501139
    title: 谐律异想断章（光荣王与先知西比尔）
    surface: 圣遗物故事，讲失乡的神祇与「说预言的金蜂」相遇，后在梅洛皮斯建国。
    target: 「光荣王」与「先知西比尔」的来历，以及「奏响乐章」这一政体的原型
    confidence: strong
    basis: >-
      **两位主角**：①**失乡的神祇**——「他原是**绿洲的歌者**，却在**烈日君主**的威光下
      失去了故国。因不愿侍奉**沙王**的御座」，流亡至「万水之源无光的海渊之下」的无人城墟；
      ②**西比尔**——「我曾是**守护银树的使者**，却在漫长的时间里**失去了神智与身形**」，
      自述「我的眼中还能看到未来」，被称为「说预言的**金蜂**」。
      **立国**：「话音落下，无水的城窟轰然倒塌，**银树化作金色的航船**，
      这就是日后**奏响乐章的光荣王**与先知西比尔的初次邂逅」；随后
      「**爱乐的神在梅洛皮斯垒起高塔**，引来离散之民建立新邦」，
      「丰饶的号角使土地得以出产，往来航船将诸岛连为一体」。
      **自我怀疑**（末段转折）：「这本应是无虑的好时代，为何领唱者的…」
      「然而，新造的荣耀之国越是繁荣昌盛，我便愈加感到惶惑与悲戚」。
    caveat: >-
      **本条把两条原本分离的线索接了起来**：
      （一）	heory.vision-price 里「无论是须弥的那位花神，还是**预言了涨水的西比尔**，
      她们都曾试图创造独立于地脉与『黑玛门尼』的系统」——此处的西比尔即同一人，
      其身份是「守护银树的使者」，被贬为「金蜂」形态；
      （二）allusion.fortuna-and-ancient-orders 里鲁杰罗研究的「**法图纳**」大乐章，
      与「奏响乐章的光荣王」「爱乐的神」在概念上直接对应，说明枫丹前文明的统治术
      可上溯到这位失乡神祇。
      但「梅洛皮斯」与「卡皮托利姆」（黄金剧团）、「雷穆利亚」三者的先后关系，
      语料未明，**不可强行排序**。
    extra: >-
      「烈日君主」「沙王」应是须弥沙漠的统治者（或赤王一侧），说明这位神祇是从须弥流亡到枫丹的。
      「银树化作金色的航船」与亥珀波瑞亚「苍银的树」是否同源，属推测，不作断言。
    status: open

  - id: allusion.primordial-icedragon-experiment
    doc: quest.obc.509534
    title: 「原初之人」实验与至冬冰封（BWiki 校对确认）
    surface: 亥珀波瑞亚人用原初冰龙的血肉打造「原初之人」，实验失控导致至冬冰封。
    target: 至冬变冷的**根本原因**——不是天罚，而是自己造神的实验失控
    confidence: strong
    basis: >-
      本地原文：「亥珀波瑞亚人甚至试图用**原初冰龙的血肉**作为材料打造他的身体…
      只为了他能够企及『**那一位**』曾拥有的权柄。」
      与 BWiki「至冬」专页（wiki.biligame.com/ys/至冬）的整理一致，后者补出完整链条：
      「亥珀波瑞亚人用**原初冰龙的血肉**作为材料，试图打造出能够企及尼伯龙根曾拥有权柄的
      『原初之人』，制造自己的『神明』…**实验失控了，冰之龙王尸骸失控的权能导致整个至冬
      化作原初之冰的圣土**，甚至连范围内的地脉都受到影响，变成了凝结纯化的晶矿」。
      该整理标注出处为《她的宫殿正坍塌向风雪》，此书名本地尚未抓到。
    caveat: >-
      **本条修正了 theory.hyperborea-winter 的归因**：此前我把变冷归为
      「天钉审判 → 地脉失控吸热」，现在看更直接的原因是**亥珀波瑞亚自己造神失败**——
      冰龙王尸骸的权能失控，才把整个至冬变成冰土。天钉可能是另一件事（或与实验同期）。
      两种说法（自己闯祸 / 被审判）需重新权衡，不可预设前者。
      BWiki 的整理**逐句标注了出处**（书名/任务名），确实可作本地语料的索引，
      但其转述仍属二手，本库只收本地能逐字验证的部分。
    extra: >-
      校对结果：BWiki 至冬页提到的「原初冰龙」（本地 1 段）、「萨勒莱宁」（1 段）、
      「霜夜灵嗣」（10 段）、「换生灵」（8 段）、「帕盖苏戈」（5 段）在本地均有命中，
      说明该页**大部分内容基于游戏内文本**，可信度较高，但仍有出处未能抓到
      （如《她的宫殿正坍塌向风雪》《白夜似梦初醒》《往冥府的安魂歌》）。
    status: open

  - id: allusion.her-palace-collapses
    doc: quest.obc.509591
    title: 她的宫殿正坍塌向风雪（白沙皇与至冬冰封的本地一手文本）
    surface: 7.2 至冬任务「她的宫殿正坍塌向风雪」，交代白沙皇的身世与至冬冻土的成因。
    target: ①白沙皇＝失败的原初之人；②至冬冰封的直接原因是造神实验失控
    confidence: explicit
    basis: >-
      **五段直接陈述**：
      ①「亥珀波瑞亚人甚至试图用**原初冰龙的血肉**作为材料打造他的身体…只为了他能够
      企及『那一位』曾拥有的权柄」；
      ②「他们『试图』造出，不过**实验失控了**，不然黄金城应该仍然屹立在这片土地…
      甚至此处不会如现在，是冰封千里的冻土」；
      ③「根据我们在影域中找到的残缺的记录所述，**冰之龙王的尸骸，其失控的权能**…
      导致整个至冬化作**原初之冰的圣土**」；
      ④「只是因为实验并未完成，所以他的力量并不完整…而那时亥珀波瑞亚已被没入影域」；
      ⑤「制造他的亥珀波瑞亚已然灭亡，他大可以抛之不管，可他还是接受了…
      接受了自己是『**失败的原初之人**』这件事」。
      另有：「『**眼镜**』，也就是那无数次实验后造出的『**雏原人**』，就是让沙皇陛下成为
      『原初之人』的钥匙」；以及沙皇的神躯「在和我们交谈，或与妖精们同行的时候会化作
      类人妖精的化身」。
    caveat: >-
      **本条修正了 theory.hyperborea-winter 的归因**：该推论此前把变冷归为
      「天钉审判 → 地脉失控吸热」。现在有了本地一手材料，直接原因明确是
      **亥珀波瑞亚自己造神失败**——冰龙王尸骸权能失控，把整个至冬冻成冰土。
      天钉仍可能是独立的另一件事（或与实验同期），但**不能再当作变冷的直接原因**。
      本条已通过 BWiki「至冬」专页交叉验证，该页引用的正是本任务。
    extra: >-
      语料校对结论：BWiki「至冬」页所引的三处出处中，《她的宫殿正坍塌向风雪》是
      **任务名**（quest.obc.509591）而非书籍；《往冥府的安魂歌》是 7.1 更新说明；
      《白夜似梦初醒》在本地仅 2 段命中（可能是任务对白）。
      另：「沙皇白桦」一句暗示白桦树其实是「他从未真正死去的躯壳向外渴求…不断生长的神经」。
    status: open

  - id: allusion.sallelenin-seven-pieces
    doc: book.obc.506481
    title: 祷歌其十六·冬日的陌客 萨勒莱宁（第三降临者被砍成七段）
    surface: 《终北祷歌集》第十六首，以祷歌形式讲述「冬日的陌客」萨勒莱宁的求婚与被分尸。
    target: 第三降临者（萨勒莱宁）的死法，与「七枚神之心」的直接对应
    confidence: explicit
    basis: >-
      **祷歌叙事**：「你乘着星间的骏马，跨过希汐的荒岛和阴暗多雾的波赫尤拉」
      「你要去向**帕盖苏戈**的女儿求婚」；而「年老的帕盖苏戈，那**受造于我等祖先的仆从**」
      提出条件——「只要你替他**打开波赫尤拉的大门**，他便让那年轻的新娘出嫁」。
      结局：「**七重灾厄的主人将你砍成了七段**，就在阴暗多雾的波赫尤拉，
      帕盖苏戈的女儿呀，那年轻纯净的姑娘，从此再也不会出嫁」。
      祷歌末段呼求：「我呼唤你那不可言的名字，**疗治世间苦痛与不幸的迷途英雄**，
      愿你的慈惠平息寒夜中的狂风」。
    caveat: >-
      **「砍成七段」与「七枚神之心」的对应**：另一处材料说「天理用**第三降临者的遗骨**
      造了七枚神之心」（quest.obc.509101），而「七重灾厄的主人」正是霜月之子对天理的
      称呼（见《终北祷歌集》的神名对照）。两条并置，可确认**七枚神之心＝萨勒莱宁的七段尸身**。
      不过祷歌是韵文，数字「七」也可能有象征意味，故只记对应、不下绝对结论。
    extra: >-
      「帕盖苏戈」是「受造于我等祖先的仆从」——即妖精/妖灵一类造物；
      他要求「打开波赫尤拉的大门」，与后来白沙皇「打开深渊之门」的行为结构相同
      （都是"以打开某扇门为代价"），两者的门是否同一扇，语料未明。
      祷歌把第三降临者称为「疗治世间苦痛与不幸的迷途英雄」，立场明显是**颂扬**而非谴责。
    status: open

  - id: allusion.envoy-satire
    doc: book.obc.509469
    title: 极星舞剧集·特使（钦差大臣式的宫廷讽刺剧）
    surface: 科洛列夫茨基剧团的舞剧集，卷三《特使》讲述皇帝特使驾临地方时的谄媚丑态。
    target: 至冬宫廷与地方贵族的真实生态——以讽刺剧形式影射
    confidence: tentative
    basis: >-
      **明显的文学原型**：剧中人物「**赫列斯达科夫**」是果戈里《钦差大臣》主角的名字，
      而情节同样是「地方官员误把外来者当成皇帝特使、争相谄媚」。台词如
      「领民们，皆因**皇帝特使**的驾临而荣光满面；皆为能一睹您身上那**苍星的余辉**，而泪如泉涌」
      「我的好朋友们，庆祝吧！我光荣地带回了**苍星特使**承诺的未来」。
      另有「施佩金**子爵**」一名。
    caveat: >-
      「施佩金」与《苍星妖灵史略》所载历史人物「**施佩金军团**」同名（史书中该军团
      「在战役关键时失败的追击」）。若为同一指涉，则这出舞剧是**至冬贵族以戏剧形式
      讽刺/影射真实历史事件**——但语料未点明两者关系，故仅标 tentative。
      本剧体裁是讽刺喜剧，「真实影射」与「纯文学戏仿」两种解释都成立。
    extra: >-
      《极星舞剧集》另外两出（《火鸟》《海鸟》）是纯抒情舞剧（追逐火鸟、镜之剑等意象），
      无现实指涉。唯《特使》因人物命名特殊而值得记录。
      该剧团名为「科洛列夫茨基」——与 BWiki 提到的「科洛列夫茨基剧院」同名
      （《死魂灵的夜曲》提到天使文明曾改造地脉建起该剧院），可能只是剧团/剧院重名。
    status: open
