# 推论层 · 考据结论
#
# 这里放「需要联想的结论」：一个判断由多条证据支撑，证据散在不同文档里，
# 有的直说、有的只是暗示。与 claims 的区别：
#   claims   = 谁相信什么（单出处、带立场）；
#   theories = 从多处线索推出的世界观结论（多证据、可含反证）。
#
# 铁律：每条证据都必须能在 corpus 里找到原话，找不到就不写。
# 不硬编码 section_id，只写 doc_id + 短引用，灌库时现场解析。
#
# kind 取值：
#   direct       原文直接陈述
#   implied      隐晦暗示，需联想才能连上
#   corroboration 他处旁证/呼应
#   counter      反证或矛盾（不一定是错，也可以是「不可靠叙述」）
#
# 用法：改完跑
#   tools/python/python.exe scripts/load_theories.py            # 干跑校验
#   tools/python/python.exe scripts/load_theories.py --apply    # 写库 + 导出卡片

version: 1
batch: 2026-11-12-moon-sisters

theories:
  - id: theory.moon-sisters
    title: 提瓦特曾有三轮明月（三月女神）
    confidence: likely
    status: open
    spoiler_level: 3
    aliases: [三轮明月, 三轮皓月, 三姐妹, 月宫三姐妹, 月夜的君王, 三月女神, 三位月之女]
    entities: [entity.san-yue-nv-shen, entity.jiang-lin]
    claim: >-
      提瓦特的夜空曾有三轮明月，即三位月之女神姐妹：恒月艾莉亚、虹月桑娜妲、霜月卡侬。
      她们并非自有之物——是龙王尼伯龙根所造、代其执掌世界权能的「星球的影子」，
      也就是守护提瓦特的三颗卫星与「星球意志的代行」。三姐妹在灾祸中死别：
      最终有两轮明月碎成尘埃，最后一轮留在行宫不再离开；恒月艾莉亚的力量凝为「月髓」。
      今日夜空的月数已与当初不同。
    open_questions:
      - 最后一轮明月「不再离开她们的行宫」——行宫在哪，它是否就是今日夜空的那一轮
      - 菈乌玛说三月女神在「葬火之战还未发生前」与天空岛法则和谐共处，而另有记载说她们死于「降临者引发的战争」——这两句话指的是同一场灾祸吗
      - 「库塔尔」（哥伦比娅）与霜月女神卡侬是什么关系——「霜月之子」信仰库塔尔，而卡侬是霜月女神
      - 「三轮皓月有同一个爱人，是司晨的星辰」——晨星指谁（全库「司晨」仅 1 处）
      - 反证文本说「三个月亮是彻头彻尾的谎言」，这本书是哪本、作者为何如此写
      - 「三月女神」与「月宫三姐妹」的「月宫」是同一个场所吗
    evidence:
      - doc: book.obc.1146        # 竹林月夜
        quote: 在久远的过去，夜空曾挂着三轮明月
        kind: direct
        note: 设定的最早出处。全篇不写「三月女神」，只写「三轮明月」「三姐妹」
      - doc: book.obc.1146
        quote: 她们驾着银色的高车巡游，每过一旬，便由一位姐妹接替另一位的王位
        kind: direct
        note: 三位轮值的月王
      - doc: book.obc.1146
        quote: 三轮皓月有同一个爱人，是司晨的星辰
        kind: direct
        note: 三姐妹共有一个爱人「晨星」，这条线索在全库只此一处
      - doc: book.obc.516         # 碎梦奇珍
        quote: 过去的天上曾有三轮皓月，她们的名字分别是艾莉亚、桑娜妲与卡侬
        kind: direct
        note: 唯一在书里直接给出三人姓名的地方
      - doc: quest.obc.507858     # 空月之歌 第八幕「真实之月」
        quote: 龙王尼伯龙根令空中升起三轮明月，月的神明初诞
        kind: direct
        note: 起源——月亮不是自有，而是被造
      - doc: quest.obc.507858
        quote: 星球的影子，为代替龙王尼伯龙根掌握权能管理世界而出生
        kind: direct
        note: 本质——三姐妹是尼伯龙根意志的延长，不是独立神明
      - doc: char.obc.505973      # 菈乌玛
        quote: 受命于尼伯龙根的三月女神曾与天空岛的法则和谐共处
        kind: direct
        note: 唯一直接使用「三月女神」这个术语的地方；且点出与天空岛曾有蜜月期
      - doc: char.obc.505973
        quote: 三月曾是守护提瓦特的三颗卫星
        kind: direct
        note: 定性为「卫星」；同段还说「三月女神则是星球意志的代行」，即职能定义
      - doc: lore.obc.509001      # 亚-伊里穆存储阵列索引表
        quote: 父神尼伯龙根为我们留下的三位月之女
        kind: corroboration
        note: 又一别名「三位月之女」；且把尼伯龙根称为「父神」，说明它们视其为造物主
      - doc: quest.obc.507953     # 夜空中的月亮·三月
        quote: 虹月女神，桑娜妲
        kind: direct
        note: 称号之一；任务名本身就叫「三月」
      - doc: quest.obc.507953
        quote: 恒月女神艾莉亚是三位女神中最稳重的一位
        kind: direct
        note: 性格与领导地位
      - doc: char.obc.507505      # 哥伦比娅
        quote: 霜月女神卡侬
        kind: direct
        note: 第三位的称号
      - doc: weapon.obc.4443      # 贯月矢
        quote: 曾经有三个姐妹。每到夜晚，她们就离开珍珠色的宫殿
        kind: corroboration
        note: 武器故事的诗意叙述，补出「珍珠色的宫殿」
      - doc: weapon.obc.4443
        quote: 最终有两轮明月碎成了尘埃，消失不见了
        kind: direct
        note: 结局——三轮变一轮。同段还说「姐妹中的最后一人也太过哀恸，不再离开她们的行宫」
      - doc: quest.obc.506587     # 第 28 步补证据时挖到，补上了「灾祸成因」这块空白
        quote: 三位月之女神在一场因「降临者」引发的战争中尽数逝去
        kind: direct
        note: 灾祸的直接成因是「降临者」引发的战争；同段还说「除『霜月』之外，其余两个月亮先后破碎」，与贯月矢互证
      - doc: weapon.obc.4443
        quote: 因为相互映照的三姐妹，无论何时都渴望着团聚
        kind: corroboration
        note: 点出三姐妹的羁绊，可与「死别」呼应
      - doc: artifact.obc.3867    # 辰砂往生录
        quote: 当夜空的三姐妹殉身于灾祸
        kind: corroboration
        note: 圣遗物侧写，与「死别」呼应
      - doc: weapon.obc.507623    # 帷间夜曲
        quote: 为众生纺出命运银线的三姐妹
        kind: corroboration
        note: 职能的另一个侧面：纺命运之线
      - doc: book.obc.513         # 绝云记闻
        quote: 于月宫三姐妹的见证中立下了结合的誓言
        kind: corroboration
        note: 「月宫三姐妹」这个别名只在本书出现，说明她们参与了早期仙灵的誓约
      - doc: quest.obc.506558     # 空月之歌 第二幕
        quote: 恒月的艾莉亚死后，其力量凝聚为了这颗月髓
        kind: direct
        note: 直接给出「艾莉亚已死」与月髓的因果
      - doc: char.obc.508596      # 尼可
        quote: 高悬于夜空的三轮明月，其数依旧为三
        kind: implied
        note: 「其数依旧为三」是反讽式暗示——现在已不再是三，需结合上下文才读得出
      - doc: book.obc.505883      # 无头的科奎塔奥
        quote: 无法用双眼见证三轮明月的死亡
        kind: implied
        note: 用「明月的死亡」暗示陨落，全句是谜语式表述
      - doc: quest.obc.507425     # 空月之歌 第五幕「终北的夜行诗」
        quote: 三个月亮是彻头彻尾的谎言
        kind: counter
        note: >-
          这句是派蒙在念一本书的内容。菈乌玛当场评价「写这本书的人甚至都没有见过库塔尔」，
          所以它更可能是后世信仰文本的臆造，而不是事实反证——但既然原文存在，就必须收进来，
          不能因为与结论不符就丢掉。

  - id: theory.hyperborea-winter
    title: 至冬的严寒不是自古如此：亥珀波瑞亚的陷落
    confidence: speculative
    status: open
    spoiler_level: 2
    aliases: [至冬, 亥珀波瑞亚, 极夜时代, 温暖的春天]
    entities: [entity.snezhnaya]
    claim: >-
      今日被冰雪覆盖的至冬，前身是名为**「黄金之城」亥珀波瑞亚**的国度。多方史料一致记载那里曾
      气候温暖、草木葱茏，是「春天不愿离开」的丰饶之地；而它如今陷入永冬。关于它如何失落，
      语料给出的不是单一原因，而是**三层叠加**：
      （一）**它主动反叛了天空**——「逆光之矢蓄势待发，将准星瞄向**天城**，就连初生的妖灵也被
      武装了起来」，「叛逆的头领们…与其设法苟延求生不如坦然赴死」，理由是「不敢承认天空的谎言」；
      （二）**判决与执行**——「僭越者的城邦被判罚的**天钉**所消灭」，且「毁灭的判决已经写下…
      他们的全部努力到头来只是让那场审判**推迟了三十年**」；
      （三）**物理机制**——「**地脉**…失控的…**吸收了所有的热量，变化成了漆黑的厄生晶矿，
      北国之陆因此变为一片冻土**」。
      另有传说一套：后人在安逸中失去崇高，或「永恒的光明之王」因昼夜更替不可逆而震怒。
      三层与传说并不互斥——反叛招致判决，判决经天钉与地脉失控执行，传说则是同一场灾变的道德化讲述。
      需注意它同时是**加害方**（曾派军团屠戮诸国，见 allusions 之 elys-and-golden-city-legion）
      与**受害者**，两个叙述各自成立、只是选取了不同时段。
    open_questions:
      - 「永恒的光明之王」是谁？与天理/天空岛是否同一存在（另见 theory.sky-isle-and-celestia）
      - 「地脉变动」与「神罚」是同一件事的两种叙述，还是前后相继的两场灾变
      - 「极夜时代」是字面上的永夜（无日照），还是比喻意义上的黑暗纪元
      - 「阴影浮流之地」是地名还是某种空间状态；都城是否还存在于其中
      - 七位先存之神与十二位先存之人，与后来的「尘世七执政」是否同源
      - 妖精从「亥珀波瑞亚公民」到「蒙昧迷信」用了多久（手记说「那么短的时间内」）
      - 亥珀波瑞亚与坎瑞亚是否有传承关系（两者都是"被覆灭的黄金国度"）
    evidence:
      - doc: book.obc.509470        # 至冬国通史 · 史料佐证
        quote: 这片如今被称作「至冬」的、为银雪荫覆的广袤冻土
        kind: direct
        note: 明确对比"如今"与"古老纪元"，同段说此地曾气候温暖、草木葱茏
      - doc: book.obc.509470        # 通史转述的其一：道德堕落说
        quote: 直到他们的后人在安逸中失去了崇高
        kind: direct
        note: 传说的第一种解释——春天主动抛弃家园，属「道德堕落招致天罚」母题；同段还说春天不愿离开时「那里永远是温暖的春天」
      - doc: book.obc.509470        # 通史转述的其二：光明之王报复说
        quote: 震怒的光明之王摧毁了亥珀波瑞亚
        kind: direct
        note: 第二种解释，出自《圣丝翠维莎歌本》；同段开头说「永恒的光明之王无法容忍黑暗的到来」，结尾说七位先存之神血裔被屠尽、仅末代君王之子幸免
      - doc: book.obc.509470
        quote: 这部通史，上溯极夜时代的传说
        kind: implied
        note: 「极夜时代」这个说法暗示曾有漫长黑夜，与"永冬"可能是同一件事的两种表述
      - doc: lore.obc.509517        # 报章体描述现状
        quote: 我们的大陆上有这样一个冰雪眷顾的国度
        kind: corroboration
        note: 现今视角，把至冬的寒冷当作既定事实
      - doc: char.obc.509103        # 至冬角色
        quote: 毕竟至冬的雪夜如此寒冷
        kind: corroboration
        note: 人间视角的寒冷
      - doc: voice.obc.509829
        quote: 天气虽然寒冷，可我们的家中还是常有鲜花
        kind: corroboration
        note: 至冬人在严寒中刻意保留鲜花——可能是对"失落的春天"的集体记忆残留
        # 这条是主观解读，标为旁证而非直接证据
      # === 7.2 版本新材料（2026-11-13 增量同步后补）===
      - doc: lore.obc.510348        # 亥珀波瑞亚遗民手记·确立"黄金之城"
        quote: 我等是黄金之城亥珀波瑞亚之民
        kind: direct
        note: 同段给出三件事：都城的名字与地位（黄金之城）、结局（沉入阴影浮流之地）、成因（地脉变动导致黑色晶灾）
      - doc: lore.obc.510348        # 成因的另一版本
        quote: 地脉变动导致黑色的晶灾如流吞没一切
        kind: direct
        note: 与"神罚"并存的第二种解释，且更接近物理成因；这条把推论从"传说"拉向"灾变史"
      - doc: lore.obc.510348        # 妖精曾是公民
        quote: 妖精与人类一样曾是亥珀波瑞亚的公民
        kind: direct
        note: 说明亥珀波瑞亚是人与妖精共治的多族文明，不是单一人类国度
      - doc: lore.obc.510348
        quote: 它们怎么会在那么短的时间内陷入这样蒙昧迷信的境地
        kind: implied
        note: 遗民亲历者的困惑——文明断裂之快不正常，暗示记忆被外力抹除或压制
      - doc: quest.obc.510406       # 妖精的真正起源
        quote: 妖精一开始是亥珀波瑞亚人造的人造生命
        kind: direct
        note: 把妖精的起源钉在亥珀波瑞亚的造物行为上，是全条最硬的一句
      - doc: quest.obc.510411
        quote: 古亥珀波瑞亚人为了达成超越制造了我们
        kind: corroboration
        note: 造物者的动机——"为了达成超越"，与"黄金之城"的僭越性呼应
      - doc: quest.obc.510406       # 遗民流散
        quote: 他们为了躲避厄生晶矿的灾害来到此处
        kind: direct
        note: 灾后遗民的迁徙路径；同段说亥珀波瑞亚曾生活在此
      - doc: quest.obc.510406       # 晶灾与地脉的因果
        quote: 那时候地脉受到影响，有许多克什尼克晶矿被转化成了这种厄生晶矿
        kind: corroboration
        note: 给出机制——"地脉受影响"会把普通晶矿转化成吞没城市的厄生晶矿
      - doc: geo.obc.510396         # 集体记忆仍在
        quote: 曾有人希望这份温暖能够由此不断扩张
        kind: corroboration
        note: 至冬人至今仍在尝试"把温暖扩张回整片冻土"——传说不是死档案，而是活的目标
      - doc: geo.obc.510393
        quote: 昔日吞没此处的晶灾一度消退
        kind: corroboration
        note: 说明晶灾有"退潮"的可能，不是一次性的终局
      # === 第 31 步（暗示梳理）新增：三层叙述的关键证据 ===
      - doc: lore.obc.510350       # 调查者的手札【至冬】——物理机制
        quote: 吸收了所有的热量
        kind: direct
        note: 全库唯一把"覆灭→变冷"讲成物理链条的文本：地脉失控吸走全部热量、转化为厄生晶矿，北国因此冻土化
      - doc: artifact.obc.508651   # 天之美赐——主动反叛
        quote: 逆光之矢蓄势待发，将准星瞄向天城
        kind: direct
        note: 证明亥珀波瑞亚是举兵反叛的一方，而非单纯受罚；同段说"与其设法苟延求生不如坦然赴死"
      - doc: lore.obc.509607       # 某位高贵之人的笔记——天钉与命运锁定
        quote: 僭越者的城邦被判罚的天钉所消灭
        kind: direct
        note: 给出执行手段（天钉）；同段还说"毁灭的判决已经写下…只是让那场审判推迟了三十年"
      - doc: weapon.obc.506390     # 峡湾长歌——至冬即前身
        quote: 传说冬季来自亥珀波瑞亚
        kind: direct
        note: 以"冬季来自亥珀波瑞亚"直接定义今之至冬；同段说这片冻土"将自己与大陆的脐带切断"
      - doc: weapon.obc.509877     # 织月者的曙色——圣嗣计划的存在
        quote: 因为你注定要为终北的众民诞下乐园的新主
        kind: corroboration
        note: 说明覆灭后遗民仍在执行"圣嗣"计划，是灾变未终结文明的旁证

  - id: theory.sky-isle-and-celestia
    title: 天理与天空岛：外来的秩序强加者，还是世界的创造者
    confidence: likely
    status: open
    spoiler_level: 3
    aliases: [天理, 天空岛, 众神, 外来的秩序, 天理的钉子]
    entities: [entity.tian-li, entity.tian-kong-dao, entity.seven-archons]
    claim: >-
      天理与天空岛是同一套外来秩序的两个面：天空岛是它的居所与执行机构，天理是其意志。
      有直接证词说「众神」与天空岛「果然是外来之物」，也有记载说「来自天外的掠夺者…迫使人类
      屈从于其立定的秩序」。但原文同时又说「天理创造了提瓦特如今的绝大部分事物」、
      「是天理夺走了世界树，加以改造」——它究竟是造物主还是掠夺者，两种说法在语料里并存，
      这正是这条推论要摆出来的矛盾。
    open_questions:
      - 若天理是外来者，为何又能"创造提瓦特绝大部分事物"（是改造原住民世界，还是真的创世）
      - 天空岛与天理是同一实体还是从属关系（原文只说"天空岛的死之执政"与"天理的钉子"并存）
      - 「永恒的光明之王」是否就是天理（另见 theory.hyperborea-winter）
      - 天空岛的法则曾经「宽容」，后来又收紧，转折点是什么
      - 七执政从「天理」手中接过权柄，那争夺与出让的具体过程为何
    evidence:
      - doc: quest.obc.3427         # 深渊教团视角
        quote: 「众神」和天空岛果然是外来之物
        kind: direct
        note: 说话者是深渊教团一方，立场鲜明，但它是全库唯一一句把「众神」「天空岛」与「外来」并列的陈述
      - doc: lore.obc.505728
        quote: 来自天外的掠夺者可以封锁整个星球
        kind: direct
        note: 同句说「以迫使人类屈从于其立定的秩序」——把「封锁」与「立定秩序」连成一套机制，而不只是征服
      - doc: quest.obc.510238
        quote: 我们刚击败了天空岛的死之执政，天理的钉子就出现异变
        kind: implied
        note: 全库唯一同时出现「天空岛」与「天理」的句子，暗示两者是同一体系：天空岛有「死之执政」，而「天理的钉子」随之异变
      - doc: quest.obc.5778
        quote: 神之心作为「天理」掌控提瓦特大陆与一切「法则」的象征
        kind: direct
        note: 天理的核心职能是「掌控法则」，而不是单纯的统治
      - doc: char.obc.505973        # 菈乌玛
        quote: 天空岛的法则一度十分「宽容」
        kind: corroboration
        note: 「一度」说明法则会变；同段说三月女神曾与这天法则「和谐共处过一段时间」
      # --- 反方证据：天理具有创造者属性 ---
      - doc: quest.obc.508783
        quote: 天理创造了提瓦特如今的绝大部分事物
        kind: counter
        note: 与「外来掠夺者」直接冲突的一句。但它紧接着说「对天理而言，维护大部分事物存在下去的优先级，高于保护须弥」——重心在"维护存在"而非"从无到有"
      - doc: quest.obc.508722
        quote: 是天理夺走了世界树，加以改造
        kind: counter
        note: 「夺走」暗示世界树原本不是天理的；「加以改造」又与"创造"相容。这一句同时支持两种读法
      # === 第 31 步（暗示梳理）新增：降临者编号体系 ===
      - doc: quest.obc.5778        # 第三章第五幕
        quote: 据我猜想，「第一降临者」应该就是如今的「天理」
        kind: implied
        note: 这是把「天理」与「降临者」直接挂钩的唯一表述，但措辞是「据我猜想」，非确证
      - doc: quest.obc.509101      # 映夏！归乡？千灵节！
        quote: 天理用第三降临者的遗骨造了七枚神之心
        kind: corroboration
        note: 说明天理能够"使用"降临者的遗骨——这一关系比"外来者/创造者"的二元对立更具体
      - doc: quest.obc.509101
        quote: 混入了第三降临者遗骨中的杂质
        kind: implied
        note: 同段的「星之楔」定义；把神之心与神之眼连成同一条物质链（见 theory.vision-price）
      - doc: quest.obc.507699      # 空月之歌 第七幕
        quote: 旅行者是提瓦特的第四降临者
        kind: corroboration
        note: 确认降临者有编号序列，且愚人众内部知情；第一/三/四已知，第二全库 0 命中

  - id: theory.vision-price
    title: 神之眼的代价：它是「命运」的契约，不是神明的恩赐
    confidence: likely
    status: open
    spoiler_level: 3
    aliases: [神之眼, 黑玛门尼, 愿望, 神明的注视]
    entities: [entity.vision]
    claim: >-
      关于神之眼的来历，语料里存在两套互不相容的说法。民间版本是「愿望足够强烈，神明便会
      投下视线」；而水仙十字结社的笔记给出了另一种解释：获得神之眼，是**把自身出卖给世界的
      「命运」——即「黑玛门尼」——的行为**，会「无法走上正确的道路」。这套说法还有两个旁证：
      有人专门修习「斩去自我」之法以**预防**获得神之眼；而花神与西比尔都曾试图建造独立于
      地脉与黑玛门尼的系统。若此说成立，那么持眼者得到力量的代价，是把自己交进了世界的命运编排。
    open_questions:
      - 「黑玛门尼」究竟是什么——是命运本身、一套规则，还是某个存在的名字
      - 笔记说其真相「过于骇然，或许我不该将它落于文字」，那份被隐去的真相是什么
      - 若神之眼是命运契约，为何「愿望」会成为触发条件（愿望是签约的动机，还是伪装）
      - 无主神之眼「有很小几率与人共鸣」——共鸣的判定标准是否就是"命运的安排"
      - 花神与西比尔的替代方案最终失败了吗，失败在哪一步
    evidence:
      # --- 核心：命运契约说 ---
      - doc: lore.obc.503105        # 笔记【水仙十字结社】
        quote: 获得神之眼是将自身出卖给世界的「命运」
        kind: direct
        note: 全库唯一定义句。同段把「命运」直接注为「黑玛门尼」，并说此举会「无法走上正确的道路」
      - doc: lore.obc.503105
        quote: 此举非常重要，可以预防不慎获得神之眼
        kind: implied
        note: 前置是「斩去自我…在死去之前死去」——有人宁可先杀死自我，也不愿获得神之眼
      - doc: lore.obc.509607
        quote: 关于「黑玛门尼」的真相，所得出的结论过于骇然
        kind: implied
        note: 作者刻意不落文字，说明这套机制存在一个被主动隐瞒的层面
      - doc: lore.obc.509607
        quote: 她们都曾试图创造独立于地脉与「黑玛门尼」的系统
        kind: corroboration
        note: 花神与西比尔都在对抗这套体系，反证它不是自然秩序而是可被"凿孔"的人造结构
      # --- 民间版本（作为对照与反方） ---
      - doc: char.obc.508597        # 布伦妮
        quote: 只要愿望足够强烈，神明便会投下视线
        kind: counter
        note: 民间流传的授予机制。注意措辞是「曾听说」——她自己也只是听说
      - doc: char.obc.500672        # 嘉明
        quote: 神之眼跟某种强烈的愿望有关
        kind: counter
        note: 同为民间说法，且他自己都困惑「反而随便走趟镖拿到了」，说明愿望并非充分条件
      # --- 空壳与再点亮 ---
      - doc: char.obc.78            # 凝光
        quote: 而无主的「神之眼」的空壳，是使用者死后才会留下的东西
        kind: corroboration
        note: 同段说它「有很小几率与人共鸣，且不允许多人反复尝试」——像配发而非馈赠
      - doc: char.obc.2142          # 枫原万叶
        quote: 本想借别人的手再次点亮这枚「神之眼」
        kind: implied
        note: 神之眼可易主、可被"点亮"，与"神明的专属注视"说法有张力
      # === 第 31 步（暗示梳理）新增：物质层面的解释 ===
      - doc: quest.obc.509101      # 映夏！归乡？千灵节！
        quote: 混入了第三降临者遗骨中的杂质
        kind: corroboration
        note: >-
          神之眼的物质成分：它是七执政体系的产物，而该体系的神之心由第三降临者遗骨所铸，
          故神之眼连带掺入遗骨杂质「星之楔」。这给「命运契约」提供了一个**物质层面的解释**——
          所谓"卖身于命运"可能不只是比喻，而是掺了某种属于降临者的东西
      - doc: lore.obc.506458        # 古老的书册：圣嗣项目的目标
        quote: 无需以自身的灵魂为代价
        kind: counter
        note: >-
          亥珀波瑞亚「圣嗣」项目的设计目标明写"无需借助任何祭礼用具，**无需以自身的灵魂为代价**，
          便可自由操纵未经篡改的纯净元素力"。这句话从反面**确认了现行体系是要付灵魂代价的**——
          否则不必特意声明"无需"

  - id: theory.descender-variable
    title: 降临者：不属于这个世界规则的「变数」
    confidence: likely
    status: open
    spoiler_level: 3
    aliases: [降临者, 变数, 世界之外, 降临]
    entities: [entity.jiang-lin]
    claim: >-
      「降临者」不是泛指一切外来者，而是一个有门槛的判定：只有从**世界之外**到来、且其权能
      不属于这个世界规则的存在才配得上这个称呼。这一点从一组对照里读得最清楚——原文说
      「三月的权能来自世界本身」，而降临者恰恰相反；也正因如此，一场由降临者引发的战争
      才能让「寿限比岩神更长」的三位月之女神尽数逝去。他们稀少，且能改变这个世界的命运走向。
    open_questions:
      - 「降临者」的判定门槛具体是什么（原文只排除了一部分外来物，没给正面标准）
      - 目前有几位降临者？语料里出现过旅行者、「新到的降临者」，是否还有更多
      - 「筑起拘束生命的天壳」指的是什么——是否就是虚假之天
      - 降临者为何要介入提瓦特（主动的使命，还是被这个世界吸引/召唤）
      - 三月女神的陨落究竟是被降临者直接杀死，还是其战争行动的连带结果
    evidence:
      - doc: lore.obc.507822        # 原文把变数与降临者直接等同
        quote: 同世界的「变数」（即「降临者」）相连接
        kind: direct
        note: 括号里直接注明了「变数」就是「降临者」，这是术语的硬定义
      - doc: quest.obc.7609
        quote: 并非是所有宇宙外到来的事物都能被叫做「降临」或者「变量」
        kind: implied
        note: 否定式定义——说明判定有门槛，但原文没给正面标准，这是全条最关键的空白
      - doc: quest.obc.507699       # 核心对照
        quote: 三月的权能来自世界本身
        kind: direct
        note: 同句把降临者与「三月的权能来自世界本身」并列，暗示降临者的权能不属于这个世界
      - doc: quest.obc.506587
        quote: 三位月之女神在一场因「降临者」引发的战争中尽数逝去
        kind: direct
        note: 降临者改变世界命运的直接例证
      - doc: quest.obc.507699
        quote: 凡人满地都是，降临者却很少见
        kind: direct
        note: 稀缺性；同段还说自己"期盼你成为最好的旅行者"
      - doc: artifact.obc.508651    # 记述者视角
        quote: 新到的降临者又为何筑起拘束生命的天壳
        kind: implied
        note: 「拘束生命的天壳」暗示降临者曾主动改造世界结构，与 theory.sky-isle-and-celestia 相关
      - doc: quest.obc.509534       # 旅行者自述
        quote: 可能因为我是「降临者」吧
        kind: corroboration
        note: 旅行者自我认同为降临者，且描述自己起初对世界有「旁观者」感
      # === 第 31 步（暗示梳理）新增：编号体系 ===
      - doc: quest.obc.5778        # 第三章第五幕
        quote: 据我猜想，「第一降临者」应该就是如今的「天理」
        kind: implied
        note: >-
          唯一把「降临者」与「天理」直接挂钩的表述，但措辞是「据我猜想」。
          若成立，则"这个世界的外来者"里，第一位的地位等同于现行秩序的建立者
      - doc: quest.obc.509101      # 映夏！归乡？千灵节！
        quote: 神之眼的显现一定程度上也与第三降临者有关
        kind: implied
        note: >-
          同段线索：天理用第三降临者的遗骨造了七枚神之心，而神之眼是七执政体系的产物，
          故降临者的物质竟已渗入凡人的力量装置——这解释了为何"降临者"不只是历史名词
      - doc: quest.obc.507699      # 空月之歌 第七幕（另一段）
        quote: 执行官都知道这一信息
        kind: corroboration
        note: >-
          「旅行者是提瓦特的第四降临者，执行官都知道这一信息」——说明降临者是有编号的序列，
          且愚人众内部视之为常识；第一/三/四已知，**第二全库 0 命中**，是明确的待考空位

  - id: theory.abyss-and-khaenriah
    title: 坎瑞亚不是深渊的创造者，而是「窃取者」与「被反噬者」
    confidence: likely
    status: open
    spoiler_level: 3
    aliases: [坎瑞亚, 深渊, 深渊教团, 黑血, 世界外的力量]
    entities: [entity.shen-yuan, entity.khaenriah, entity.abyss-order]
    claim: >-
      坎瑞亚与深渊的关系不是"创造"，而是**窃取后被反噬**。语料明说坎瑞亚人「窃取了支撑万象的
      深渊力量」，而深渊侵蚀他们的方式是「放大欲望」；覆灭之后，从坎瑞亚逃出的东西——邪龙、
      流淌黑血的魔兽——被描述为「由世界外的力量赐予的」生命。今天的深渊教团被指认为坎瑞亚的
      「遗民」本身。所以主线是：坎瑞亚借用了本属于世界之外的力量，这股力量反过来改造并吞掉了它。
    open_questions:
      - 「支撑万象的深渊力量」原本在支撑什么，被窃取后世界是否因此失衡
      - 覆灭是深渊反噬的结果，还是天空岛/天理出手镇压的结果（两种说法在语料里都有影子）
      - 深渊教团的目标是复国、复仇，还是完成当年未竟的窃取
      - 「五大罪人」各自的角色，与窃取深渊力量的关系
      - 丘丘人与坎瑞亚遗民的关系（语料暗示二者有关但未明说）
    evidence:
      - doc: quest.obc.505547       # 磷星之章
        quote: 正是因为他们窃取了支撑万象的深渊力量
        kind: direct
        note: 全条最关键的动词——「窃取」，直接否定"创造深渊"的读法
      - doc: quest.obc.507019       # 空月之歌 第四幕
        quote: 深渊分化坎瑞亚、诱惑他们堕落的方式，就是放大欲望
        kind: direct
        note: 深渊是主动的加害方，且手段是「放大欲望」而非武力
      - doc: item.obc.818
        quote: 坎瑞亚覆灭的时代，某位大罪人制造了无数的魔兽
        kind: direct
        note: 同段说这些魔兽「流淌着与此世不容的黑血」且「由世界外的力量赐予的」——把覆灭与"世界外的力量"扣在一起
      - doc: char.obc.507241        # 杜林
        quote: 那场源自坎瑞亚的灾变发生时
        kind: corroboration
        note: 蒙德视角——灾变源自坎瑞亚，与邪龙杜林、众多深渊魔物一同到来
      - doc: quest.obc.2247
        quote: 根本就是坎瑞亚的「遗民」本身
        kind: direct
        note: 把深渊教团直接等同于坎瑞亚遗民，是"人"的延续而不是"深渊生物"
      - doc: lore.obc.503068
        quote: 深渊可以扭曲、污染神的元素
        kind: corroboration
        note: 说明深渊的性质是"污染规则"，与被窃取后的反噬吻合
      - doc: quest.obc.3427         # 深渊教团自述
        quote: 「众神」和天空岛果然是外来之物
        kind: implied
        note: 深渊教团把众神也算作"外来之物"——若成立，则他们窃取深渊力量可能正是为了对抗外来秩序（另见 theory.sky-isle-and-celestia）
      # === 第 31 步（暗示梳理）新增：五大罪人这一环 ===
      - doc: quest.obc.505457       # 间章 第四幕「悖理」
        quote: 由五大罪人之一「黄金」莱茵多特创造的生命奇迹
        kind: direct
        note: 确认「黄金」莱茵多特为五大罪人之一；她创造人造人（阿贝多），说明罪人中有从事造物者
      - doc: quest.obc.506558       # 空月之歌 第二幕
        quote: 传说中的五大罪人
        kind: direct
        note: 同段指名「猎月人」雷利尔；并指出挪德卡莱的「狂猎」现象与罪人有关
      - doc: quest.obc.504033       # 第五章 第五幕
        quote: 大家对于五大罪人利用深渊力量这件事毫不知情
        kind: corroboration
        note: 给出罪人的定性——他们「利用深渊力量」；且说明知情范围极小，是一桩被隐瞒的事

  - id: theory.leyline-memory
    title: 世界树、地脉、记忆：同一套系统的三层
    confidence: likely
    status: open
    spoiler_level: 2
    aliases: [世界树, 地脉, 记忆, 鬼魂, 灵魂]
    entities: [entity.irminsul, entity.di-mai, entity.ji-yi]
    claim: >-
      这三者不是三个独立概念，而是一套系统的三个层次：**地脉是网络，世界树是中枢，记忆是内容物**。
      语料把关系写得很直白——世界树「可以看作是地脉汇聚形成的中枢」，而地脉「会不断吸收这个世界的
      记忆」。由此还能推出一件更冷的事：传说里的「鬼魂」，不过是**地脉对亡者的记忆**，是「过去与
      今日的共振」，并不是死者的灵魂真的回来了。灵魂与记忆在这里被分开了。
    open_questions:
      - 记忆被写入地脉的条件是什么（为什么纳塔的地脉不记录外来者）
      - 世界树被天理「夺走并改造」之前，原本的功能是什么
      - 灵魂与记忆既然被分开，那"灵魂"保存在哪里（另见 entity.ling-hun 的轮回线索）
      - 地脉里的记忆能被抽取、封装（如"罐装知识"），那能否被伪造或篡改
      - 「黑玛门尼」在地脉之上运行，那么改写地脉能否松动命运
    evidence:
      - doc: quest.obc.508722       # 系统结构的总述
        quote: 世界树与地脉紧密相连，可以看作是地脉汇聚形成的中枢
        kind: direct
        note: 一句话定下"地脉=网络、世界树=中枢"的结构
      - doc: quest.obc.508722
        quote: 它最重要的功能，就是记录和保存世间一切的知识与记忆
        kind: direct
        note: 明确世界树的功能是"记录保存"，即记忆的仓库
      - doc: quest.obc.4723
        quote: 「地脉」会不断吸收这个世界的记忆
        kind: direct
        note: 地脉是采集层；同段说「世界树」中汇集了从古到今的全部情报与智慧，形成采集→汇聚两级
      - doc: item.obc.1562
        quote: 记忆与元素在地脉中恒常奔涌
        kind: corroboration
        note: 把记忆与元素并列为地脉流转的两种东西
      - doc: book.obc.3592           # 鬼魂的定义
        quote: 所谓鬼魂，不过是地脉对亡者的记忆
        kind: direct
        note: 全条最有推论价值的一句——鬼魂不是灵魂，是记忆的复现；同句说这是「过去与今日的共振」
      - doc: item.obc.502922
        quote: 因为纳塔的地脉并不会将外来者的冒险事迹记录在内
        kind: implied
        note: 说明"记录"有归属判定——地脉只收本地事迹，暗示记忆库有边界与规则
      - doc: lore.obc.509607
        quote: 她们都曾试图创造独立于地脉与「黑玛门尼」的系统
        kind: corroboration
        note: 把这套系统与"命运"连在一起——地脉之上还压着一层「黑玛门尼」（另见 theory.vision-price）

  - id: theory.seven-archons-turnover
    title: 七执政是可更换的「岗位」，不是永恒的神位
    confidence: likely
    status: open
    spoiler_level: 2
    aliases: [尘世七执政, 七神, 神之心, 神位更迭]
    entities: [entity.seven-archons, entity.gnosis]
    claim: >-
      「尘世七执政」在两千年间并不稳定：语料明说它「亦有更迭」，而且现任七位里草神只有五百岁、
      岩王帝君在位六千余年——**同一批神位上的在位时长差了一个数量级**，说明中途换过人。
      更关键的是，交接神位的凭据看起来是神之心，而神之心是「天理」掌控世界法则的象征，
      这意味着换人这件事不完全由神自己决定。七十执政之间的关系也曾经更紧密（定期联络），
      后来才变成各自为政。
    open_questions:
      - 神位更迭由谁决定、按什么程序（天理指定？前任指定？还是竞争上位）
      - 岩王帝君退位并交出神之心，是否是主动配合某个既定流程
      - 「七」这个数字为何是七，与七种元素是绑定关系还是历史偶然
      - 草神更迭时（大慈树王→小吉祥草王）是否动过神之心
      - 若七执政集体失位，天理对世界的掌控是否就会松动
    evidence:
      - doc: quest.obc.533
        quote: 人们所说的七神，更本源的称谓是「尘世七执政」
        kind: direct
        note: 术语正名——"七神"是俗称，制度名才是「尘世七执政」，暗示它是一套建制而非七位个体
      - doc: quest.obc.1250           # 最核心的一句
        quote: 两千年来亦有更迭
        kind: direct
        note: 同段说「不仅魔神会死」，把神的死亡与神位的更迭分开讨论
      - doc: quest.obc.1250
        quote: 须弥的草之神最年轻，只有五百岁
        kind: direct
        note: 与岩王六千余年形成数量级反差，是"中途换人"最硬的证据
      - doc: quest.obc.1250
        quote: 而岩王帝君在世最久，已有六千余年
        kind: direct
        note: 同上，两句必须合看才能看出更迭
      - doc: quest.obc.5778
        quote: 神之心作为「天理」掌控提瓦特大陆与一切「法则」的象征
        kind: implied
        note: 若神之心是权柄的凭证，则退位即交出凭证，更迭就与天理直接相关
      - doc: char.obc.2404
        quote: 好像尘世七执政之间在很久很久以前还会定期联络
        kind: implied
        note: 「很久很久以前」+「还会」= 现在不再联络，制度从共治转向各自为政
      - doc: quest.obc.506587
        quote: 那时都还不存在「尘世七执政」
        kind: corroboration
        note: 给了制度的时间下界——七执政是某个阶段才建立起来的，不是提瓦特原生的
